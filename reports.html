<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// VARIABLES
// =====================================================

let sales = [];


// =====================================================
// ELEMENTS
// =====================================================

const customerSelect =
document.getElementById("customer");

const productSelect =
document.getElementById("product");

const reportTable =
document.getElementById("reportTable");

const productSummary =
document.getElementById("productSummary");

const customerSummary =
document.getElementById("customerSummary");


// =====================================================
// LOAD SALES FROM SUPABASE
// =====================================================

async function loadSales(){

    reportTable.innerHTML = `
        <tr>
            <td colspan="7" class="empty">
                Loading sales data...
            </td>
        </tr>
    `;

    const {
        data,
        error
    } =
    await supabaseClient
        .from("sales")
        .select("*")
        .order(
            "Created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Sales Load Error:",
            error
        );

        reportTable.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Sales load failed:
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;

    }


    sales = data || [];


    loadCustomerDropdown();

    loadProductDropdown();

    mainSummary();

    showReport(sales);

}


// =====================================================
// CUSTOMER DROPDOWN
// =====================================================

function loadCustomerDropdown(){

    customerSelect.innerHTML = `
        <option value="">
            All Customers
        </option>
    `;


    const customers = [];


    sales.forEach(function(sale){

        const name =
        sale["Customer _name"] || "";


        if(
            name &&
            !customers.includes(name)
        ){

            customers.push(name);

        }

    });


    customers.sort();


    customers.forEach(function(name){

        const option =
        document.createElement("option");


        option.value = name;

        option.textContent = name;


        customerSelect.appendChild(
            option
        );

    });

}


// =====================================================
// PRODUCT DROPDOWN
// =====================================================

function loadProductDropdown(){

    productSelect.innerHTML = `
        <option value="">
            All Products
        </option>
    `;


    const products = [];


    sales.forEach(function(sale){

        const name =
        sale["Product _name"] || "";


        if(
            name &&
            !products.includes(name)
        ){

            products.push(name);

        }

    });


    products.sort();


    products.forEach(function(name){

        const option =
        document.createElement("option");


        option.value = name;

        option.textContent = name;


        productSelect.appendChild(
            option
        );

    });

}


// =====================================================
// GET SALE DATE
// =====================================================

function getSaleDate(sale){

    const date =
    sale["Sale_data"];


    if(!date){

        if(sale["Created_at"]){

            return String(
                sale["Created_at"]
            ).split("T")[0];

        }

        return "";

    }


    return String(date).split("T")[0];

}


// =====================================================
// MAIN SUMMARY
// =====================================================

function mainSummary(){

    let total = 0;

    let quantity = 0;


    sales.forEach(function(sale){

        total +=
        Number(
            sale["Total"] || 0
        );


        quantity +=
        Number(
            sale["Quantity"] || 0
        );

    });


    // =============================================
    // TODAY
    // =============================================

    const today =
    new Date()
    .toISOString()
    .split("T")[0];


    let todayTotal = 0;


    sales.forEach(function(sale){

        const saleDate =
        getSaleDate(sale);


        if(saleDate === today){

            todayTotal +=
            Number(
                sale["Total"] || 0
            );

        }

    });


    document.getElementById(
        "totalSales"
    ).innerText =
    "৳ " +
    total.toLocaleString();


    document.getElementById(
        "todaySales"
    ).innerText =
    "৳ " +
    todayTotal.toLocaleString();


    document.getElementById(
        "totalQuantity"
    ).innerText =
    quantity.toLocaleString();


    document.getElementById(
        "transactions"
    ).innerText =
    sales.length;

}


// =====================================================
// FILTER REPORT
// =====================================================

function filterReport(){

    const from =
    document.getElementById(
        "fromDate"
    ).value;


    const to =
    document.getElementById(
        "toDate"
    ).value;


    const customer =
    customerSelect.value;


    const product =
    productSelect.value;


    const result =
    sales.filter(function(sale){

        const saleDate =
        getSaleDate(sale);


        // DATE FROM

        if(
            from &&
            saleDate < from
        ){

            return false;

        }


        // DATE TO

        if(
            to &&
            saleDate > to
        ){

            return false;

        }


        // CUSTOMER

        if(
            customer &&
            sale["Customer _name"] !== customer
        ){

            return false;

        }


        // PRODUCT

        if(
            product &&
            sale["Product _name"] !== product
        ){

            return false;

        }


        return true;

    });


    showReport(result);

}


// =====================================================
// SHOW REPORT
// =====================================================

function showReport(data){

    reportTable.innerHTML = "";


    let total = 0;


    if(!data || data.length === 0){

        reportTable.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No sales data found.
                </td>
            </tr>
        `;

    }


    data.forEach(function(sale){

        const saleTotal =
        Number(
            sale["Total"] || 0
        );


        total += saleTotal;


        const row =
        document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHtml(
                    getSaleDate(sale)
                )}
            </td>

            <td>
                ${escapeHtml(
                    sale["Customer _name"] || ""
                )}
            </td>

            <td>
                ${escapeHtml(
                    sale["Product _name"] || ""
                )}
            </td>

            <td>
                ${escapeHtml(
                    sale["Product _code"] || ""
                )}
            </td>

            <td>
                ${Number(
                    sale["Quantity"] || 0
                ).toLocaleString()}
            </td>

            <td>
                ৳ ${Number(
                    sale["Tp"] || 0
                ).toLocaleString()}
            </td>

            <td>
                ৳ ${saleTotal.toLocaleString()}
            </td>

        `;


        reportTable.appendChild(row);

    });


    document.getElementById(
        "reportTotal"
    ).innerText =
    "৳ " +
    total.toLocaleString();


    showProductSummary(data);

    showCustomerSummary(data);

}


// =====================================================
// PRODUCT SUMMARY
// =====================================================

function showProductSummary(data){

    const summary = {};


    data.forEach(function(sale){

        const name =
        sale["Product _name"] ||
        "Unknown";


        if(!summary[name]){

            summary[name] = {

                quantity:0,

                total:0

            };

        }


        summary[name].quantity +=
        Number(
            sale["Quantity"] || 0
        );


        summary[name].total +=
        Number(
            sale["Total"] || 0
        );

    });


    productSummary.innerHTML = "";


    const names =
    Object.keys(summary);


    if(names.length === 0){

        productSummary.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    No product sales found.
                </td>
            </tr>
        `;

        return;

    }


    names.sort();


    names.forEach(function(name){

        const row =
        document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHtml(name)}
            </td>

            <td>
                ${summary[name].quantity.toLocaleString()}
            </td>

            <td>
                ৳ ${summary[name].total.toLocaleString()}
            </td>

        `;


        productSummary.appendChild(row);

    });

}


// =====================================================
// CUSTOMER SUMMARY
// =====================================================

function showCustomerSummary(data){

    const summary = {};


    data.forEach(function(sale){

        const name =
        sale["Customer _name"] ||
        "Unknown";


        if(!summary[name]){

            summary[name] = {

                transactions:0,

                quantity:0,

                total:0

            };

        }


        summary[name].transactions++;


        summary[name].quantity +=
        Number(
            sale["Quantity"] || 0
        );


        summary[name].total +=
        Number(
            sale["Total"] || 0
        );

    });


    customerSummary.innerHTML = "";


    const names =
    Object.keys(summary);


    if(names.length === 0){

        customerSummary.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    No customer sales found.
                </td>
            </tr>
        `;

        return;

    }


    names.sort();


    names.forEach(function(name){

        const row =
        document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHtml(name)}
            </td>

            <td>
                ${summary[name].transactions.toLocaleString()}
            </td>

            <td>
                ${summary[name].quantity.toLocaleString()}
            </td>

            <td>
                ৳ ${summary[name].total.toLocaleString()}
            </td>

        `;


        customerSummary.appendChild(row);

    });

}


// =====================================================
// CLEAR FILTER
// =====================================================

function clearFilter(){

    document.getElementById(
        "fromDate"
    ).value = "";


    document.getElementById(
        "toDate"
    ).value = "";


    customerSelect.value = "";


    productSelect.value = "";


    showReport(sales);

}


// =====================================================
// DOWNLOAD CSV
// =====================================================

function downloadCSV(){

    const from =
    document.getElementById(
        "fromDate"
    ).value;


    const to =
    document.getElementById(
        "toDate"
    ).value;


    const customer =
    customerSelect.value;


    const product =
    productSelect.value;


    const data =
    sales.filter(function(sale){

        const saleDate =
        getSaleDate(sale);


        if(
            from &&
            saleDate < from
        ){

            return false;

        }


        if(
            to &&
            saleDate > to
        ){

            return false;

        }


        if(
            customer &&
            sale["Customer _name"] !== customer
        ){

            return false;

        }


        if(
            product &&
            sale["Product _name"] !== product
        ){

            return false;

        }


        return true;

    });


    if(data.length === 0){

        alert(
            "No sales data found!"
        );

        return;

    }


    let csv =
    "Date,Customer,Phone,Product,Code,Category,Pack Size,Unit,Quantity,TP,MRP,Total\n";


    data.forEach(function(sale){

        csv +=

        `"${csvSafe(
            getSaleDate(sale)
        )}",` +

        `"${csvSafe(
            sale["Customer _name"] || ""
        )}",` +

        `"${csvSafe(
            sale["Customer_phone"] || ""
        )}",` +

        `"${csvSafe(
            sale["Product _name"] || ""
        )}",` +

        `"${csvSafe(
            sale["Product _code"] || ""
        )}",` +

        `"${csvSafe(
            sale["Category"] || ""
        )}",` +

        `"${csvSafe(
            sale["Pack _size"] || ""
        )}",` +

        `"${csvSafe(
            sale["Unit"] || ""
        )}",` +

        `"${sale["Quantity"] || 0}",` +

        `"${sale["Tp"] || 0}",` +

        `"${sale["Mrp"] || 0}",` +

        `"${sale["Total"] || 0}"\n`;

    });


    const blob =
    new Blob(
        [csv],
        {
            type:
            "text/csv;charset=utf-8;"
        }
    );


    const url =
    URL.createObjectURL(blob);


    const link =
    document.createElement("a");


    link.href = url;


    link.download =
    "Sales-Report.csv";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);

}


// =====================================================
// CSV SAFE
// =====================================================

function csvSafe(value){

    return String(value)
        .replace(/"/g,'""');

}


// =====================================================
// PRINT
// =====================================================

function printReport(){

    window.print();

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard(){

    window.location.href =
    "dashboard.html";

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


// =====================================================
// START
// =====================================================

async function start(){

    await loadSales();

}


start();

</script>
