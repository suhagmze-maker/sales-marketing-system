```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Reports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:22px;
}

.back-btn{
    background:white;
    color:#2563eb;
    border:none;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1450px;
    margin:30px auto;
    padding:20px;
}

.status{
    padding:13px;
    border-radius:8px;
    margin-bottom:20px;
    background:#eef4ff;
    color:#1d4ed8;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card p{
    color:#666;
    margin-bottom:10px;
}

.card h2{
    color:#2563eb;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
    color:#222;
}

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:15px;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    background:white;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.buttons button{
    border:none;
    padding:11px 18px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.search-btn{
    background:#2563eb;
}

.clear-btn{
    background:#64748b;
}

.download-btn{
    background:#16a34a;
}

.print-btn{
    background:#7c3aed;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1200px;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#f1f5f9;
}

.empty{
    text-align:center;
    padding:35px;
    color:#777;
}

.report-total{
    margin-top:20px;
    padding:15px;
    background:#eef4ff;
    border-radius:8px;
    text-align:right;
    font-size:20px;
    font-weight:bold;
    color:#1d4ed8;
}

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;
}

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .container{
        padding:10px;
    }

}

@media print{

    .header,
    .status,
    .cards,
    .filters,
    .buttons,
    .delete-btn{
        display:none !important;
    }

    body{
        background:white;
    }

    .box{
        box-shadow:none;
    }

}

</style>

</head>

<body>


<div class="header">

    <h2>Sales Reports</h2>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>


<div class="container">


<div
    id="status"
    class="status">

    Connecting to Supabase...

</div>


<!-- SUMMARY -->

<div class="cards">


<div class="card">

    <p>Total Sales</p>

    <h2 id="totalSales">
        ৳ 0
    </h2>

</div>


<div class="card">

    <p>Today's Sales</p>

    <h2 id="todaySales">
        ৳ 0
    </h2>

</div>


<div class="card">

    <p>Total Quantity</p>

    <h2 id="totalQuantity">
        0
    </h2>

</div>


<div class="card">

    <p>Total Transactions</p>

    <h2 id="transactions">
        0
    </h2>

</div>


</div>


<!-- REPORT -->

<div class="box">

<h1>Sales Report</h1>


<div class="filters">


<input
    type="date"
    id="fromDate">


<input
    type="date"
    id="toDate">


<select id="customerFilter">

    <option value="">
        All Customers
    </option>

</select>


<select id="productFilter">

    <option value="">
        All Products
    </option>

</select>


</div>


<div class="buttons">

<button
    class="search-btn"
    onclick="applyFilter()">

    Search

</button>


<button
    class="clear-btn"
    onclick="clearFilter()">

    Clear

</button>


<button
    class="download-btn"
    onclick="downloadCSV()">

    Download CSV

</button>


<button
    class="print-btn"
    onclick="window.print()">

    Print

</button>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>Date</th>

<th>Customer</th>

<th>Employee</th>

<th>Product</th>

<th>Code</th>

<th>Pack Size</th>

<th>Quantity</th>

<th>TP</th>

<th>MRP</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>


<tbody id="salesTable">

</tbody>

</table>

</div>


<div class="report-total">

    Report Total:

    <span id="reportTotal">
        ৳ 0
    </span>

</div>


</div>


</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// DATA
// =====================================================

let salesData = [];

let productsData = [];

let filteredData = [];


// =====================================================
// MONEY
// =====================================================

function money(value){

    return "৳ " +
        Number(value || 0)
        .toLocaleString();

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// =====================================================
// DATE
// =====================================================

function formatDate(value){

    if(!value){
        return "-";
    }

    const d =
        new Date(value);

    if(isNaN(d.getTime())){
        return "-";
    }

    return d.toLocaleDateString(
        "en-GB"
    );

}


// =====================================================
// LOAD PRODUCTS
// =====================================================

async function loadProducts(){

    const result =
        await supabaseClient
        .from("products")
        .select(
`
id,
name,
code,
category,
pack_size,
unit,
tp,
mrp,
stock,
created_at
`
        );


    if(result.error){

        console.error(
            "Product load error:",
            result.error
        );

        productsData = [];

        return;

    }


    productsData =
        result.data || [];

}


// =====================================================
// FIND PRODUCT
// =====================================================

function findProduct(productId){

    if(
        productId === null ||
        productId === undefined
    ){

        return null;

    }


    return productsData.find(
        function(product){

            return String(product.id) ===
                   String(productId);

        }
    ) || null;

}


// =====================================================
// LOAD SALES
// =====================================================

async function loadSales(){

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "Loading sales data...";


    // Products first

    await loadProducts();


    // =================================================
    // IMPORTANT
    // ONLY CONFIRMED ORDERS COLUMNS
    // =================================================

    const result =
        await supabaseClient
        .from("orders")
        .select(
`
id,
created_at,
customer_name,
employee_name,
product_name,
quantity,
unit_price,
total_amount,
product_id
`
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            "Sales load error:",
            result.error
        );


        status.innerText =
            "Sales load failed: " +
            result.error.message;


        status.style.background =
            "#fee2e2";

        status.style.color =
            "#b91c1c";


        return;

    }


    salesData =
        (result.data || [])
        .map(
            function(sale){

                // Match orders.product_id
                // with products.id

                const product =
                    findProduct(
                        sale.product_id
                    );


                /*
                 TP:
                 ALWAYS prefer products.tp

                 MRP:
                 ALWAYS take products.mrp

                 Total:
                 Use orders.total_amount
                */

                const tp =
                    product
                    ? Number(product.tp || 0)
                    : Number(sale.unit_price || 0);


                const mrp =
                    product
                    ? Number(product.mrp || 0)
                    : 0;


                return {

                    id:
                        sale.id,

                    created_at:
                        sale.created_at,

                    customer_name:
                        sale.customer_name || "",

                    employee_name:
                        sale.employee_name || "",

                    product_name:
                        sale.product_name || "",

                    quantity:
                        Number(
                            sale.quantity || 0
                        ),

                    unit_price:
                        Number(
                            sale.unit_price || 0
                        ),

                    total_amount:
                        Number(
                            sale.total_amount || 0
                        ),

                    product_id:
                        sale.product_id,

                    code:
                        product
                        ? product.code || ""
                        : "",

                    pack_size:
                        product
                        ? product.pack_size || ""
                        : "",

                    unit:
                        product
                        ? product.unit || ""
                        : "",

                    tp:
                        tp,

                    mrp:
                        mrp

                };

            }
        );


    filteredData =
        [...salesData];


    loadFilters();

    updateSummary();

    displaySales(
        filteredData
    );


    if(salesData.length === 0){

        status.innerText =
            "Supabase connected, but orders table is empty.";

    }
    else{

        status.innerText =
            salesData.length +
            " sales loaded successfully.";

    }


    status.style.background =
        "#dcfce7";

    status.style.color =
        "#166534";

}


// =====================================================
// FILTER DROPDOWNS
// =====================================================

function loadFilters(){

    const customerFilter =
        document.getElementById(
            "customerFilter"
        );


    const productFilter =
        document.getElementById(
            "productFilter"
        );


    customerFilter.innerHTML = `
        <option value="">
            All Customers
        </option>
    `;


    productFilter.innerHTML = `
        <option value="">
            All Products
        </option>
    `;


    const customers = [];

    const products = [];


    salesData.forEach(
        function(sale){

            if(
                sale.customer_name &&
                !customers.includes(
                    sale.customer_name
                )
            ){

                customers.push(
                    sale.customer_name
                );

            }


            if(
                sale.product_name &&
                !products.includes(
                    sale.product_name
                )
            ){

                products.push(
                    sale.product_name
                );

            }

        }
    );


    customers.sort();

    products.sort();


    customers.forEach(
        function(name){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                name;

            option.textContent =
                name;

            customerFilter.appendChild(
                option
            );

        }
    );


    products.forEach(
        function(name){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                name;

            option.textContent =
                name;

            productFilter.appendChild(
                option
            );

        }
    );

}


// =====================================================
// SUMMARY
// =====================================================

function updateSummary(){

    let totalSales = 0;

    let totalQuantity = 0;


    salesData.forEach(
        function(sale){

            totalSales +=
                Number(
                    sale.total_amount || 0
                );


            totalQuantity +=
                Number(
                    sale.quantity || 0
                );

        }
    );


    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    let todaySales = 0;


    salesData.forEach(
        function(sale){

            if(!sale.created_at){
                return;
            }


            const saleDate =
                new Date(
                    sale.created_at
                )
                .toISOString()
                .split("T")[0];


            if(
                saleDate === today
            ){

                todaySales +=
                    Number(
                        sale.total_amount || 0
                    );

            }

        }
    );


    document.getElementById(
        "totalSales"
    ).innerText =
        money(totalSales);


    document.getElementById(
        "todaySales"
    ).innerText =
        money(todaySales);


    document.getElementById(
        "totalQuantity"
    ).innerText =
        totalQuantity.toLocaleString();


    document.getElementById(
        "transactions"
    ).innerText =
        salesData.length;

}


// =====================================================
// DISPLAY
// =====================================================

function displaySales(data){

    const table =
        document.getElementById(
            "salesTable"
        );


    table.innerHTML = "";


    let grandTotal = 0;


    if(data.length === 0){

        table.innerHTML = `

        <tr>

            <td
                colspan="11"
                class="empty">

                No sales data found.

            </td>

        </tr>

        `;


        document.getElementById(
            "reportTotal"
        ).innerText =
            money(0);


        return;

    }


    data.forEach(
        function(sale){

            grandTotal +=
                Number(
                    sale.total_amount || 0
                );


            const row =
                document.createElement(
                    "tr"
                );


            const pack =
                (
                    (sale.pack_size || "") +
                    " " +
                    (sale.unit || "")
                ).trim();


            row.innerHTML = `

                <td>
                    ${formatDate(
                        sale.created_at
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        sale.customer_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        sale.employee_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        sale.product_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        sale.code
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        pack
                    )}
                </td>

                <td>
                    ${sale.quantity}
                </td>

                <td>
                    ${money(
                        sale.tp
                    )}
                </td>

                <td>
                    ${money(
                        sale.mrp
                    )}
                </td>

                <td>
                    ${money(
                        sale.total_amount
                    )}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteSale('${sale.id}')">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    document.getElementById(
        "reportTotal"
    ).innerText =
        money(grandTotal);

}


// =====================================================
// FILTER
// =====================================================

function applyFilter(){

    const fromDate =
        document.getElementById(
            "fromDate"
        ).value;


    const toDate =
        document.getElementById(
            "toDate"
        ).value;


    const customer =
        document.getElementById(
            "customerFilter"
        ).value;


    const product =
        document.getElementById(
            "productFilter"
        ).value;


    filteredData =
        salesData.filter(
            function(sale){

                if(
                    !sale.created_at
                ){

                    return false;

                }


                const saleDate =
                    new Date(
                        sale.created_at
                    )
                    .toISOString()
                    .split("T")[0];


                if(
                    fromDate &&
                    saleDate < fromDate
                ){

                    return false;

                }


                if(
                    toDate &&
                    saleDate > toDate
                ){

                    return false;

                }


                if(
                    customer &&
                    sale.customer_name !== customer
                ){

                    return false;

                }


                if(
                    product &&
                    sale.product_name !== product
                ){

                    return false;

                }


                return true;

            }
        );


    displaySales(
        filteredData
    );

}


// =====================================================
// CLEAR
// =====================================================

function clearFilter(){

    document.getElementById(
        "fromDate"
    ).value = "";


    document.getElementById(
        "toDate"
    ).value = "";


    document.getElementById(
        "customerFilter"
    ).value = "";


    document.getElementById(
        "productFilter"
    ).value = "";


    filteredData =
        [...salesData];


    displaySales(
        filteredData
    );

}


// =====================================================
// DELETE
// =====================================================

async function deleteSale(id){

    if(
        !confirm(
            "Are you sure you want to delete this sale?"
        )
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("orders")
        .delete()
        .eq(
            "id",
            id
        );


    if(result.error){

        alert(
            "Delete failed: " +
            result.error.message
        );

        return;

    }


    alert(
        "Sale deleted successfully."
    );


    await loadSales();

}


// =====================================================
// CSV
// =====================================================

function downloadCSV(){

    if(
        filteredData.length === 0
    ){

        alert(
            "No sales data found."
        );

        return;

    }


    let csv =
        "Date,Customer,Employee,Product,Code,Pack Size,Quantity,TP,MRP,Total\n";


    filteredData.forEach(
        function(sale){

            const pack =
                (
                    (sale.pack_size || "") +
                    " " +
                    (sale.unit || "")
                ).trim();


            csv +=
                `"${formatDate(sale.created_at)}",` +
                `"${sale.customer_name || ""}",` +
                `"${sale.employee_name || ""}",` +
                `"${sale.product_name || ""}",` +
                `"${sale.code || ""}",` +
                `"${pack}",` +
                `"${sale.quantity || 0}",` +
                `"${sale.tp || 0}",` +
                `"${sale.mrp || 0}",` +
                `"${sale.total_amount || 0}"\n`;

        }
    );


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        "Sales-Report.csv";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


// =====================================================
// START
// =====================================================

loadSales();

</script>

</body>

</html>
```
