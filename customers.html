<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Customer Management</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}


body {
    background: #f4f6f9;
}


.header {

    background: #2563eb;

    color: white;

    padding: 18px 25px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.header h2 {
    font-size: 22px;
}


.back-btn {

    background: white;

    color: #2563eb;

    border: none;

    padding: 9px 15px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;

}


.container {

    max-width: 1050px;

    margin: 30px auto;

    padding: 20px;

}


/* COUNT */

.count-box {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 25px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

}


.count-title {

    color: #666;

    font-size: 16px;

    margin-bottom: 8px;

}


.count-number {

    font-size: 32px;

    font-weight: bold;

    color: #2563eb;

}


/* BOX */

.box {

    background: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

    margin-bottom: 25px;

}


h1 {

    margin-bottom: 20px;

    color: #222;

}


/* FORM */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

}


.full {

    grid-column: 1 / -1;

}


label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 7px;

    font-size: 15px;

}


.save-btn {

    margin-top: 20px;

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 7px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


.save-btn:hover {

    background: #1d4ed8;

}


.cancel-btn {

    margin-top: 10px;

    width: 100%;

    padding: 11px;

    border: none;

    border-radius: 7px;

    background: #64748b;

    color: white;

    font-size: 15px;

    cursor: pointer;

    display: none;

}


/* TABLE */

.table-wrapper {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

}


th,
td {

    padding: 12px;

    border-bottom: 1px solid #ddd;

    text-align: left;

}


th {

    background: #f1f5f9;

}


/* BUTTONS */

.edit-btn {

    background: #16a34a;

    color: white;

    border: none;

    padding: 7px 10px;

    border-radius: 5px;

    cursor: pointer;

    margin-right: 5px;

}


.delete-btn {

    background: #dc2626;

    color: white;

    border: none;

    padding: 7px 10px;

    border-radius: 5px;

    cursor: pointer;

}


#message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

}


/* MOBILE */

@media (max-width: 700px) {

    .form-grid {

        grid-template-columns: 1fr;

    }

    .full {

        grid-column: auto;

    }

    table {

        min-width: 800px;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h2>
        Customer Management
    </h2>


    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>



<div class="container">


<!-- CUSTOMER COUNT -->

<div class="count-box">

    <div class="count-title">
        Total Customers
    </div>

    <div
        class="count-number"
        id="customerCount">

        0

    </div>

</div>



<!-- CUSTOMER FORM -->

<div class="box">


<h1 id="formTitle">
    Add Customer
</h1>


<form id="customerForm">


<div class="form-grid">


<!-- NAME -->

<div>

<label>
    Customer Name
</label>

<input
    type="text"
    id="customerName"
    placeholder="Enter customer name"
    required>

</div>



<!-- PHONE -->

<div>

<label>
    Phone Number
</label>

<input
    type="tel"
    id="phone"
    placeholder="Enter phone number"
    required>

</div>



<!-- TYPE -->

<div>

<label>
    Customer Type
</label>


<select
    id="customerType"
    required>

<option value="">
    Select type
</option>

<option value="Retailer">
    Retailer
</option>

<option value="Wholesaler">
    Wholesaler
</option>

<option value="Distributor">
    Distributor
</option>

<option value="Other">
    Other
</option>

</select>

</div>



<!-- ADDRESS -->

<div class="full">

<label>
    Address
</label>

<input
    type="text"
    id="address"
    placeholder="Enter customer address"
    required>

</div>


</div>



<button
    class="save-btn"
    id="saveBtn"
    type="submit">

    Save Customer

</button>



<button
    class="cancel-btn"
    id="cancelBtn"
    type="button"
    onclick="cancelEdit()">

    Cancel Edit

</button>


</form>


<p id="message"></p>


</div>



<!-- CUSTOMER LIST -->

<div class="box">


<h1>
    Customer List
</h1>


<div class="table-wrapper">


<table>


<thead>

<tr>

<th>
    Name
</th>

<th>
    Phone
</th>

<th>
    Type
</th>

<th>
    Address
</th>

<th>
    Action
</th>

</tr>

</thead>


<tbody
    id="customerList">
</tbody>


</table>


</div>


</div>


</div>



<script>


// =====================================
// LOAD CUSTOMERS
// =====================================

let customers = [];

let editIndex = -1;



function loadCustomers() {

    const saved =
        localStorage.getItem(
            "customers"
        );


    if (saved) {

        try {

            const data =
                JSON.parse(saved);


            if (Array.isArray(data)) {

                customers = data;

            } else {

                customers = [];

            }

        } catch(error) {

            customers = [];

        }

    } else {

        customers = [];

    }

}



// প্রথমবার data load

loadCustomers();



// =====================================
// UPDATE COUNT
// =====================================

function updateCustomerCount() {

    document.getElementById(
        "customerCount"
    ).innerText =
        customers.length;

}



// =====================================
// DISPLAY CUSTOMERS
// =====================================

function displayCustomers() {


    const list =
        document.getElementById(
            "customerList"
        );


    list.innerHTML = "";


    customers.forEach(
    function(customer, index) {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${customer.name || ""}
            </td>

            <td>
                ${customer.phone || ""}
            </td>

            <td>
                ${customer.type || ""}
            </td>

            <td>
                ${customer.address || ""}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editCustomer(${index})">

                    Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteCustomer(${index})">

                    Delete

                </button>

            </td>

        `;


        list.appendChild(row);

    });


    updateCustomerCount();

}



// =====================================
// SAVE CUSTOMER
// =====================================

document
.getElementById("customerForm")
.addEventListener(
"submit",
function(event) {


    event.preventDefault();


    const customer = {

        name:
            document.getElementById(
                "customerName"
            ).value.trim(),

        phone:
            document.getElementById(
                "phone"
            ).value.trim(),

        type:
            document.getElementById(
                "customerType"
            ).value,

        address:
            document.getElementById(
                "address"
            ).value.trim()

    };



    // =================================
    // NEW CUSTOMER
    // =================================

    if (editIndex === -1) {

        customers.push(customer);


        showMessage(
            "Customer saved successfully!",
            "green"
        );

    }


    // =================================
    // UPDATE CUSTOMER
    // =================================

    else {

        customers[editIndex] =
            customer;


        showMessage(
            "Customer updated successfully!",
            "green"
        );


        editIndex = -1;


        document.getElementById(
            "formTitle"
        ).innerText =
            "Add Customer";


        document.getElementById(
            "saveBtn"
        ).innerText =
            "Save Customer";


        document.getElementById(
            "cancelBtn"
        ).style.display =
            "none";

    }



    // =================================
    // SAVE TO LOCAL STORAGE
    // =================================

    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );



    // RESET FORM

    document
    .getElementById(
        "customerForm"
    )
    .reset();



    // REFRESH LIST

    displayCustomers();

});



// =====================================
// EDIT CUSTOMER
// =====================================

function editCustomer(index) {


    const customer =
        customers[index];


    editIndex = index;


    document.getElementById(
        "customerName"
    ).value =
        customer.name || "";


    document.getElementById(
        "phone"
    ).value =
        customer.phone || "";


    document.getElementById(
        "customerType"
    ).value =
        customer.type || "";


    document.getElementById(
        "address"
    ).value =
        customer.address || "";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Edit Customer";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Update Customer";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



// =====================================
// CANCEL EDIT
// =====================================

function cancelEdit() {


    editIndex = -1;


    document
    .getElementById(
        "customerForm"
    )
    .reset();


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add Customer";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Save Customer";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}



// =====================================
// DELETE CUSTOMER
// =====================================

function deleteCustomer(index) {


    if (
        confirm(
            "Are you sure you want to delete this customer?"
        )
    ) {


        customers.splice(
            index,
            1
        );


        localStorage.setItem(
            "customers",
            JSON.stringify(customers)
        );


        displayCustomers();

    }

}



// =====================================
// MESSAGE
// =====================================

function showMessage(
    text,
    color
) {


    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.style.color =
        color;

}



// =====================================
// DASHBOARD
// =====================================

function goDashboard() {

    window.location.href =
        "dashboard.html";

}



// =====================================
// INITIAL DISPLAY
// =====================================

displayCustomers();

</script>


</body>

</html>
