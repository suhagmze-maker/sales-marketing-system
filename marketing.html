<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Management</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: white;
    color: #2563eb;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

h1 {
    color: #222;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.save-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.cancel-btn {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #64748b;
    color: white;
    font-size: 15px;
    cursor: pointer;
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f1f5f9;
}

.edit-btn {
    background: #16a34a;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 5px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.status {
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
}

.active {
    background: #dcfce7;
    color: #166534;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.completed {
    background: #e0e7ff;
    color: #3730a3;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
    padding: 25px;
}

@media (max-width: 700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .box {
        overflow-x: auto;
    }

    table {
        min-width: 1100px;
    }

}

</style>

</head>

<body>

<div class="header">

    <h2>
        Marketing Management
    </h2>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>


<div class="container">


<!-- CAMPAIGN FORM -->

<div class="box">

    <h1 id="formTitle">
        Add Marketing Campaign
    </h1>


    <form id="marketingForm">


        <div class="form-grid">


            <div>

                <label>
                    Campaign Name
                </label>

                <input
                    type="text"
                    id="campaignName"
                    placeholder="Enter campaign name"
                    required>

            </div>


            <div>

                <label>
                    Campaign Type
                </label>

                <select
                    id="campaignType"
                    required>

                    <option value="">
                        Select Type
                    </option>

                    <option value="Promotion">
                        Promotion
                    </option>

                    <option value="Discount">
                        Discount
                    </option>

                    <option value="Product Launch">
                        Product Launch
                    </option>

                    <option value="Retail Activation">
                        Retail Activation
                    </option>

                    <option value="Digital Marketing">
                        Digital Marketing
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    id="startDate"
                    required>

            </div>


            <div>

                <label>
                    End Date
                </label>

                <input
                    type="date"
                    id="endDate"
                    required>

            </div>


            <div>

                <label>
                    Campaign Budget
                </label>

                <input
                    type="number"
                    id="budget"
                    placeholder="Enter budget"
                    min="0"
                    step="0.01"
                    required>

            </div>


            <div>

                <label>
                    Target Customers
                </label>

                <select
                    id="targetCustomer"
                    required>

                    <option value="">
                        Select Target
                    </option>

                    <option value="All Customers">
                        All Customers
                    </option>

                    <option value="Retailer">
                        Retailer
                    </option>

                    <option value="Wholesaler">
                        Wholesaler
                    </option>

                    <option value="Distributor">
                        Distributor
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Status
                </label>

                <select
                    id="status"
                    required>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Active">
                        Active
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="full">

                <label>
                    Campaign Details
                </label>

                <textarea
                    id="details"
                    placeholder="Write campaign details..."></textarea>

            </div>


        </div>


        <button
            class="save-btn"
            id="saveBtn"
            type="submit">

            Save Campaign

        </button>


        <button
            class="cancel-btn"
            id="cancelBtn"
            type="button"
            onclick="cancelEdit()">

            Cancel Edit

        </button>


    </form>


    <p id="message"></p>

</div>


<!-- CAMPAIGN LIST -->

<div class="box">

    <h1>
        Campaign History
    </h1>


    <table>

        <thead>

            <tr>

                <th>Campaign</th>
                <th>Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Budget</th>
                <th>Target</th>
                <th>Status</th>
                <th>Details</th>
                <th>Action</th>

            </tr>

        </thead>


        <tbody id="campaignList"></tbody>

    </table>

</div>


</div>


<script>


/* ==========================================
   LOAD CAMPAIGNS
========================================== */

let campaigns =
    JSON.parse(
        localStorage.getItem("campaigns")
    ) || [];


let editIndex = -1;


/* ==========================================
   DISPLAY CAMPAIGNS
========================================== */

function displayCampaigns() {

    const list =
        document.getElementById(
            "campaignList"
        );


    list.innerHTML = "";


    if (campaigns.length === 0) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    No marketing campaigns found.

                </td>

            </tr>

        `;

        return;

    }


    campaigns.forEach(
        function(campaign, index) {

            const row =
                document.createElement("tr");


            let statusClass =
                "pending";


            if (
                campaign.status === "Active"
            ) {

                statusClass = "active";

            }


            if (
                campaign.status === "Completed"
            ) {

                statusClass = "completed";

            }


            row.innerHTML = `

                <td>
                    ${campaign.name}
                </td>

                <td>
                    ${campaign.type}
                </td>

                <td>
                    ${campaign.startDate}
                </td>

                <td>
                    ${campaign.endDate}
                </td>

                <td>
                    ৳ ${Number(
                        campaign.budget || 0
                    ).toLocaleString()}
                </td>

                <td>
                    ${campaign.target}
                </td>

                <td>

                    <span
                        class="status ${statusClass}">

                        ${campaign.status}

                    </span>

                </td>

                <td>
                    ${campaign.details || "-"}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editCampaign(${index})">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCampaign(${index})">

                        Delete

                    </button>

                </td>

            `;


            list.appendChild(row);

        }
    );

}


/* ==========================================
   SAVE CAMPAIGN
========================================== */

document
.getElementById("marketingForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const campaign = {

            name:
                document.getElementById(
                    "campaignName"
                ).value.trim(),

            type:
                document.getElementById(
                    "campaignType"
                ).value,

            startDate:
                document.getElementById(
                    "startDate"
                ).value,

            endDate:
                document.getElementById(
                    "endDate"
                ).value,

            budget:
                Number(
                    document.getElementById(
                        "budget"
                    ).value
                ),

            target:
                document.getElementById(
                    "targetCustomer"
                ).value,

            status:
                document.getElementById(
                    "status"
                ).value,

            details:
                document.getElementById(
                    "details"
                ).value.trim()

        };


        if (editIndex === -1) {

            campaigns.push(campaign);


            showMessage(
                "Campaign saved successfully!",
                "green"
            );

        } else {

            campaigns[editIndex] =
                campaign;


            editIndex = -1;


            showMessage(
                "Campaign updated successfully!",
                "green"
            );


            document.getElementById(
                "formTitle"
            ).innerText =
                "Add Marketing Campaign";


            document.getElementById(
                "saveBtn"
            ).innerText =
                "Save Campaign";


            document.getElementById(
                "cancelBtn"
            ).style.display =
                "none";

        }


        localStorage.setItem(
            "campaigns",
            JSON.stringify(campaigns)
        );


        document
        .getElementById(
            "marketingForm"
        )
        .reset();


        displayCampaigns();

    }
);


/* ==========================================
   EDIT CAMPAIGN
========================================== */

function editCampaign(index) {

    const campaign =
        campaigns[index];


    editIndex = index;


    document.getElementById(
        "campaignName"
    ).value =
        campaign.name;


    document.getElementById(
        "campaignType"
    ).value =
        campaign.type;


    document.getElementById(
        "startDate"
    ).value =
        campaign.startDate;


    document.getElementById(
        "endDate"
    ).value =
        campaign.endDate;


    document.getElementById(
        "budget"
    ).value =
        campaign.budget;


    document.getElementById(
        "targetCustomer"
    ).value =
        campaign.target;


    document.getElementById(
        "status"
    ).value =
        campaign.status;


    document.getElementById(
        "details"
    ).value =
        campaign.details;


    document.getElementById(
        "formTitle"
    ).innerText =
        "Edit Marketing Campaign";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Update Campaign";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   CANCEL EDIT
========================================== */

function cancelEdit() {

    editIndex = -1;


    document
    .getElementById(
        "marketingForm"
    )
    .reset();


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add Marketing Campaign";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Save Campaign";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


/* ==========================================
   DELETE
========================================== */

function deleteCampaign(index) {

    if (
        confirm(
            "Are you sure you want to delete this campaign?"
        )
    ) {

        campaigns.splice(
            index,
            1
        );


        localStorage.setItem(
            "campaigns",
            JSON.stringify(campaigns)
        );


        displayCampaigns();

    }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    color
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.style.color =
        color;

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


/* ==========================================
   INITIAL LOAD
========================================== */

displayCampaigns();

</script>

</body>

</html>
