<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   DATA
========================================== */

let campaigns = [];
let editId = null;


/* ==========================================
   LOAD CAMPAIGNS
========================================== */

async function loadCampaigns() {

    const list =
        document.getElementById("campaignList");

    list.innerHTML = `
        <tr>
            <td colspan="9" class="empty">
                Loading campaigns...
            </td>
        </tr>
    `;

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("marketing_campaigns")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(
                "Load campaign error:",
                error
            );

            list.innerHTML = `
                <tr>
                    <td colspan="9" class="empty">
                        Failed to load campaigns:
                        ${escapeHTML(error.message)}
                    </td>
                </tr>
            `;

            return;
        }


        campaigns = data || [];

        displayCampaigns();

    }

    catch(error) {

        console.error(error);

        list.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    Something went wrong.
                </td>
            </tr>
        `;

    }

}


/* ==========================================
   DISPLAY CAMPAIGNS
========================================== */

function displayCampaigns() {

    const list =
        document.getElementById("campaignList");

    list.innerHTML = "";


    if (campaigns.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    No marketing campaigns found.
                </td>
            </tr>
        `;

        return;
    }


    campaigns.forEach(
        function(campaign) {

            const row =
                document.createElement("tr");


            let statusClass = "pending";


            if (campaign.status === "Active") {
                statusClass = "active";
            }


            if (campaign.status === "Completed") {
                statusClass = "completed";
            }


            row.innerHTML = `

                <td>
                    ${escapeHTML(campaign.name)}
                </td>

                <td>
                    ${escapeHTML(campaign.type)}
                </td>

                <td>
                    ${escapeHTML(campaign.start_date)}
                </td>

                <td>
                    ${escapeHTML(campaign.end_date)}
                </td>

                <td>
                    ৳ ${Number(
                        campaign.budget || 0
                    ).toLocaleString()}
                </td>

                <td>
                    ${escapeHTML(campaign.target)}
                </td>

                <td>

                    <span class="status ${statusClass}">

                        ${escapeHTML(
                            campaign.status
                        )}

                    </span>

                </td>

                <td>
                    ${escapeHTML(
                        campaign.details || "-"
                    )}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editCampaign('${campaign.id}')">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCampaign('${campaign.id}')">

                        Delete

                    </button>

                </td>

            `;


            list.appendChild(row);

        }
    );

}


/* ==========================================
   SAVE / UPDATE CAMPAIGN
========================================== */

document
.getElementById("marketingForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const saveBtn =
            document.getElementById("saveBtn");


        saveBtn.disabled = true;


        saveBtn.innerText =
            editId
            ? "Updating..."
            : "Saving...";


        const campaign = {

            name:
                document.getElementById(
                    "campaignName"
                ).value.trim(),

            type:
                document.getElementById(
                    "campaignType"
                ).value,

            start_date:
                document.getElementById(
                    "startDate"
                ).value,

            end_date:
                document.getElementById(
                    "endDate"
                ).value,

            budget:
                Number(
                    document.getElementById(
                        "budget"
                    ).value || 0
                ),

            target:
                document.getElementById(
                    "targetCustomer"
                ).value,

            status:
                document.getElementById(
                    "status"
                ).value,

            details:
                document.getElementById(
                    "details"
                ).value.trim()

        };


        try {


            /* ================================
               UPDATE
            ================================= */

            if (editId) {

                const {
                    error
                } =
                await supabaseClient
                    .from("marketing_campaigns")
                    .update(campaign)
                    .eq("id", editId);


                if (error) {
                    throw error;
                }


                showMessage(
                    "Campaign updated successfully!",
                    "green"
                );

            }


            /* ================================
               INSERT
            ================================= */

            else {

                const {
                    error
                } =
                await supabaseClient
                    .from("marketing_campaigns")
                    .insert(campaign);


                if (error) {
                    throw error;
                }


                showMessage(
                    "Campaign saved successfully!",
                    "green"
                );

            }


            editId = null;


            document
            .getElementById("marketingForm")
            .reset();


            document.getElementById(
                "formTitle"
            ).innerText =
                "Add Marketing Campaign";


            document.getElementById(
                "saveBtn"
            ).innerText =
                "Save Campaign";


            document.getElementById(
                "cancelBtn"
            ).style.display =
                "none";


            await loadCampaigns();

        }

        catch(error) {

            console.error(
                "Campaign save error:",
                error
            );


            showMessage(
                "Save failed: " +
                error.message,
                "red"
            );

        }


        saveBtn.disabled = false;


        saveBtn.innerText =
            editId
            ? "Update Campaign"
            : "Save Campaign";

    }
);


/* ==========================================
   EDIT CAMPAIGN
========================================== */

function editCampaign(id) {

    const campaign =
        campaigns.find(
            function(item) {

                return String(item.id) ===
                       String(id);

            }
        );


    if (!campaign) {

        alert(
            "Campaign not found."
        );

        return;

    }


    editId =
        campaign.id;


    document.getElementById(
        "campaignName"
    ).value =
        campaign.name || "";


    document.getElementById(
        "campaignType"
    ).value =
        campaign.type || "";


    document.getElementById(
        "startDate"
    ).value =
        campaign.start_date || "";


    document.getElementById(
        "endDate"
    ).value =
        campaign.end_date || "";


    document.getElementById(
        "budget"
    ).value =
        campaign.budget || "";


    document.getElementById(
        "targetCustomer"
    ).value =
        campaign.target || "";


    document.getElementById(
        "status"
    ).value =
        campaign.status || "Pending";


    document.getElementById(
        "details"
    ).value =
        campaign.details || "";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Edit Marketing Campaign";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Update Campaign";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   CANCEL EDIT
========================================== */

function cancelEdit() {

    editId = null;


    document
    .getElementById("marketingForm")
    .reset();


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add Marketing Campaign";


    document.getElementById(
        "saveBtn"
    ).innerText =
        "Save Campaign";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


/* ==========================================
   DELETE CAMPAIGN
========================================== */

async function deleteCampaign(id) {

    if (
        !confirm(
            "Are you sure you want to delete this campaign?"
        )
    ) {

        return;

    }


    try {

        const {
            error
        } =
        await supabaseClient
            .from("marketing_campaigns")
            .delete()
            .eq("id", id);


        if (error) {
            throw error;
        }


        showMessage(
            "Campaign deleted successfully!",
            "green"
        );


        await loadCampaigns();

    }

    catch(error) {

        console.error(
            "Delete error:",
            error
        );


        showMessage(
            "Delete failed: " +
            error.message,
            "red"
        );

    }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    color
) {

    const message =
        document.getElementById("message");


    message.innerText =
        text;


    message.style.color =
        color;


    setTimeout(
        function() {

            message.innerText = "";

        },
        4000
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


/* ==========================================
   INITIAL LOAD
========================================== */

loadCampaigns();


/* ==========================================
   AUTO REFRESH
========================================== */

setInterval(
    loadCampaigns,
    10000
);

</script>
