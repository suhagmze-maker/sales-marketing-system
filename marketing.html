```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn{
    background:white;
    color:#2563eb;
    border:none;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

h1{
    color:#222;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.save-btn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.cancel-btn{
    margin-top:10px;
    width:100%;
    padding:11px;
    border:none;
    border-radius:7px;
    background:#64748b;
    color:white;
    font-size:15px;
    cursor:pointer;
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f1f5f9;
}

.edit-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.status{
    padding:5px 9px;
    border-radius:5px;
    font-size:13px;
    font-weight:bold;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.completed{
    background:#e0e7ff;
    color:#3730a3;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.empty,
.loading{
    text-align:center;
    color:#777;
    padding:25px;
}

.loading{
    color:#2563eb;
    font-weight:bold;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .box{
        overflow-x:auto;
    }

}

</style>

</head>

<body>


<div class="header">

    <h2>
        Marketing Management
    </h2>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>


<div class="container">


<!-- ==========================================
     CAMPAIGN FORM
========================================== -->

<div class="box">

    <h1 id="formTitle">
        Add Marketing Campaign
    </h1>

    <form id="marketingForm">

        <div class="form-grid">


            <div>

                <label>
                    Campaign Name
                </label>

                <input
                    type="text"
                    id="campaignName"
                    placeholder="Enter campaign name"
                    required>

            </div>


            <div>

                <label>
                    Campaign Type
                </label>

                <select
                    id="campaignType"
                    required>

                    <option value="">
                        Select Type
                    </option>

                    <option value="Promotion">
                        Promotion
                    </option>

                    <option value="Discount">
                        Discount
                    </option>

                    <option value="Product Launch">
                        Product Launch
                    </option>

                    <option value="Retail Activation">
                        Retail Activation
                    </option>

                    <option value="Digital Marketing">
                        Digital Marketing
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    id="startDate"
                    required>

            </div>


            <div>

                <label>
                    End Date
                </label>

                <input
                    type="date"
                    id="endDate"
                    required>

            </div>


            <div>

                <label>
                    Campaign Budget
                </label>

                <input
                    type="number"
                    id="budget"
                    placeholder="Enter budget"
                    min="0"
                    step="0.01"
                    required>

            </div>


            <div>

                <label>
                    Target Customers
                </label>

                <select
                    id="targetCustomer"
                    required>

                    <option value="">
                        Select Target
                    </option>

                    <option value="All Customers">
                        All Customers
                    </option>

                    <option value="Retailer">
                        Retailer
                    </option>

                    <option value="Wholesaler">
                        Wholesaler
                    </option>

                    <option value="Distributor">
                        Distributor
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Status
                </label>

                <select
                    id="campaignStatus"
                    required>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Active">
                        Active
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="full">

                <label>
                    Campaign Details
                </label>

                <textarea
                    id="details"
                    placeholder="Write campaign details..."></textarea>

            </div>

        </div>


        <button
            class="save-btn"
            id="saveBtn"
            type="submit">

            Save Campaign

        </button>


        <button
            class="cancel-btn"
            id="cancelBtn"
            type="button"
            onclick="cancelEdit()">

            Cancel Edit

        </button>

    </form>


    <p id="message"></p>

</div>



<!-- ==========================================
     CAMPAIGN HISTORY
========================================== -->

<div class="box">

    <h1>
        Campaign History
    </h1>

    <table>

        <thead>

            <tr>

                <th>Campaign</th>
                <th>Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Budget</th>
                <th>Target</th>
                <th>Status</th>
                <th>Details</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="campaignList">

            <tr>

                <td
                    colspan="9"
                    class="loading">

                    Loading campaigns...

                </td>

            </tr>

        </tbody>

    </table>

</div>


</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// DATA
// =====================================================

let campaigns = [];

let editId = null;


// =====================================================
// ELEMENTS
// =====================================================

const form =
    document.getElementById(
        "marketingForm"
    );

const campaignList =
    document.getElementById(
        "campaignList"
    );

const saveBtn =
    document.getElementById(
        "saveBtn"
    );

const cancelBtn =
    document.getElementById(
        "cancelBtn"
    );

const formTitle =
    document.getElementById(
        "formTitle"
    );

const message =
    document.getElementById(
        "message"
    );


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// =====================================================
// SESSION CHECK
// =====================================================

async function checkSession(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if(error){

        throw new Error(
            "Session error: " +
            error.message
        );

    }

    if(!data.session){

        window.location.href =
            "index.html";

        return false;

    }

    console.log(
        "Logged in:",
        data.session.user.email
    );

    return true;

}


// =====================================================
// LOAD CAMPAIGNS
// =====================================================

async function loadCampaigns(){

    campaignList.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="loading">

                Loading campaigns...

            </td>

        </tr>

    `;


    try{

        const sessionOK =
            await checkSession();


        if(!sessionOK){

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient
            .from("marketing_campaigns")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Load campaign error:",
                error
            );

            campaignList.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="empty">

                        Failed to load campaigns:
                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

            return;

        }


        campaigns =
            data || [];


        displayCampaigns();

    }

    catch(error){

        console.error(
            error
        );

        campaignList.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    ${escapeHTML(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


// =====================================================
// DISPLAY
// =====================================================

function displayCampaigns(){

    campaignList.innerHTML = "";


    if(campaigns.length === 0){

        campaignList.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    No marketing campaigns found.

                </td>

            </tr>

        `;

        return;

    }


    campaigns.forEach(
        function(campaign){

            let statusClass =
                "pending";


            if(
                campaign.status ===
                "Active"
            ){

                statusClass =
                    "active";

            }


            if(
                campaign.status ===
                "Completed"
            ){

                statusClass =
                    "completed";

            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        campaign.name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        campaign.type
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        campaign.start_date
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        campaign.end_date
                    )}
                </td>

                <td>
                    ৳ ${Number(
                        campaign.budget || 0
                    ).toLocaleString()}
                </td>

                <td>
                    ${escapeHTML(
                        campaign.target
                    )}
                </td>

                <td>

                    <span
                        class="status ${statusClass}">

                        ${escapeHTML(
                            campaign.status
                        )}

                    </span>

                </td>

                <td>
                    ${escapeHTML(
                        campaign.details || "-"
                    )}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editCampaign('${campaign.id}')">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCampaign('${campaign.id}')">

                        Delete

                    </button>

                </td>

            `;


            campaignList.appendChild(
                row
            );

        }
    );

}


// =====================================================
// SAVE / UPDATE
// =====================================================

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        saveBtn.disabled =
            true;


        saveBtn.innerText =
            editId === null
            ? "Saving..."
            : "Updating...";


        try{

            const sessionOK =
                await checkSession();


            if(!sessionOK){

                return;

            }


            const campaignData = {

                name:
                    document.getElementById(
                        "campaignName"
                    ).value.trim(),

                type:
                    document.getElementById(
                        "campaignType"
                    ).value,

                start_date:
                    document.getElementById(
                        "startDate"
                    ).value,

                end_date:
                    document.getElementById(
                        "endDate"
                    ).value,

                budget:
                    Number(
                        document.getElementById(
                            "budget"
                        ).value
                    ) || 0,

                target:
                    document.getElementById(
                        "targetCustomer"
                    ).value,

                status:
                    document.getElementById(
                        "campaignStatus"
                    ).value,

                details:
                    document.getElementById(
                        "details"
                    ).value.trim()

            };


            if(
                campaignData.end_date <
                campaignData.start_date
            ){

                throw new Error(
                    "End Date cannot be before Start Date."
                );

            }


            // =========================================
            // UPDATE
            // =========================================

            if(editId !== null){

                const {
                    error
                } =
                await supabaseClient
                    .from(
                        "marketing_campaigns"
                    )
                    .update(
                        campaignData
                    )
                    .eq(
                        "id",
                        editId
                    );


                if(error){

                    throw new Error(
                        "Campaign update failed: " +
                        error.message
                    );

                }


                showMessage(
                    "Campaign updated successfully!",
                    "green"
                );

            }

            // =========================================
            // INSERT
            // =========================================

            else{

                const {
                    error
                } =
                await supabaseClient
                    .from(
                        "marketing_campaigns"
                    )
                    .insert(
                        campaignData
                    );


                if(error){

                    throw new Error(
                        "Campaign save failed: " +
                        error.message
                    );

                }


                showMessage(
                    "Campaign saved successfully!",
                    "green"
                );

            }


            editId =
                null;


            form.reset();


            formTitle.innerText =
                "Add Marketing Campaign";


            saveBtn.innerText =
                "Save Campaign";


            cancelBtn.style.display =
                "none";


            await loadCampaigns();

        }

        catch(error){

            console.error(
                "Campaign error:",
                error
            );


            showMessage(
                error.message,
                "red"
            );

        }

        finally{

            saveBtn.disabled =
                false;


            if(editId === null){

                saveBtn.innerText =
                    "Save Campaign";

            }

        }

    }
);


// =====================================================
// EDIT
// =====================================================

function editCampaign(id){

    const campaign =
        campaigns.find(
            function(item){

                return String(item.id) ===
                       String(id);

            }
        );


    if(!campaign){

        alert(
            "Campaign not found."
        );

        return;

    }


    editId =
        campaign.id;


    document.getElementById(
        "campaignName"
    ).value =
        campaign.name || "";


    document.getElementById(
        "campaignType"
    ).value =
        campaign.type || "";


    document.getElementById(
        "startDate"
    ).value =
        campaign.start_date || "";


    document.getElementById(
        "endDate"
    ).value =
        campaign.end_date || "";


    document.getElementById(
        "budget"
    ).value =
        campaign.budget || 0;


    document.getElementById(
        "targetCustomer"
    ).value =
        campaign.target || "";


    document.getElementById(
        "campaignStatus"
    ).value =
        campaign.status || "Pending";


    document.getElementById(
        "details"
    ).value =
        campaign.details || "";


    formTitle.innerText =
        "Edit Marketing Campaign";


    saveBtn.innerText =
        "Update Campaign";


    cancelBtn.style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// =====================================================
// CANCEL EDIT
// =====================================================

function cancelEdit(){

    editId =
        null;


    form.reset();


    formTitle.innerText =
        "Add Marketing Campaign";


    saveBtn.innerText =
        "Save Campaign";


    cancelBtn.style.display =
        "none";


    message.innerText =
        "";

}


// =====================================================
// DELETE
// =====================================================

async function deleteCampaign(id){

    if(
        !confirm(
            "Are you sure you want to delete this campaign?"
        )
    ){

        return;

    }


    try{

        const sessionOK =
            await checkSession();


        if(!sessionOK){

            return;

        }


        const {
            error
        } =
        await supabaseClient
            .from(
                "marketing_campaigns"
            )
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            throw new Error(
                "Campaign delete failed: " +
                error.message
            );

        }


        showMessage(
            "Campaign deleted successfully!",
            "green"
        );


        await loadCampaigns();

    }

    catch(error){

        console.error(
            "Delete error:",
            error
        );


        showMessage(
            error.message,
            "red"
        );

    }

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    color
){

    message.innerText =
        text;

    message.style.color =
        color;

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


// =====================================================
// INITIAL LOAD
// =====================================================

loadCampaigns();


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(
    loadCampaigns,
    10000
);

</script>

</body>

</html>
```
