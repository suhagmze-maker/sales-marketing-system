<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn{
    background:white;
    color:#2563eb;
    border:none;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card p{
    color:#666;
    margin-bottom:10px;
}

.card h2{
    color:#2563eb;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

h1{
    margin-bottom:20px;
    color:#222;
}

.form{
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:12px;
}

input,
select{
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    width:100%;
}

.add-btn{
    background:#16a34a;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f1f5f9;
}

.low{
    color:#dc2626;
    font-weight:bold;
}

.good{
    color:#16a34a;
    font-weight:bold;
}

.stock-in{
    color:#16a34a;
    font-weight:bold;
}

.stock-out{
    color:#dc2626;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:20px;
    display:none;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
}

.success{
    background:#dcfce7;
    color:#166534;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .form{
        grid-template-columns:2fr 1fr;
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .box{
        overflow-x:auto;
    }

    table{
        min-width:900px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h2>Inventory Management</h2>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>


<div class="container">


<!-- MESSAGE -->

<div
    id="message"
    class="message">
</div>


<!-- SUMMARY -->

<div class="cards">

    <div class="card">

        <p>Total Products</p>

        <h2 id="totalProducts">0</h2>

    </div>


    <div class="card">

        <p>Total Stock</p>

        <h2 id="totalStock">0</h2>

    </div>


    <div class="card">

        <p>Stock Value</p>

        <h2 id="stockValue">৳ 0</h2>

    </div>


    <div class="card">

        <p>Low Stock</p>

        <h2 id="lowStock">0</h2>

    </div>

</div>


<!-- STOCK IN -->

<div class="box">

    <h1>Stock In / Purchase</h1>

    <div class="form">

        <select id="productSelect">

            <option value="">
                Loading Products...
            </option>

        </select>


        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="1"
            step="1">


        <button
            id="addButton"
            class="add-btn"
            onclick="addStock()">

            + Add Stock

        </button>

    </div>

</div>


<!-- INVENTORY -->

<div class="box">

    <h1>Current Inventory</h1>

    <table>

        <thead>

            <tr>

                <th>Product</th>

                <th>Code</th>

                <th>TP</th>

                <th>MRP</th>

                <th>Current Stock</th>

                <th>Stock Value</th>

                <th>Status</th>

            </tr>

        </thead>

        <tbody id="inventoryTable">

        </tbody>

    </table>

</div>


<!-- STOCK MOVEMENT -->

<div class="box">

    <h1>Stock Movement</h1>

    <table>

        <thead>

            <tr>

                <th>Date</th>

                <th>Product</th>

                <th>Type</th>

                <th>Quantity</th>

            </tr>

        </thead>

        <tbody id="movementTable">

        </tbody>

    </table>

</div>


</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// VARIABLES
// =====================================================

let products = [];

let currentUser = null;


// =====================================================
// ELEMENTS
// =====================================================

const productSelect =
document.getElementById("productSelect");

const quantityInput =
document.getElementById("quantity");

const addButton =
document.getElementById("addButton");

const inventoryTable =
document.getElementById("inventoryTable");

const movementTable =
document.getElementById("movementTable");


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text,type){

    const box =
    document.getElementById("message");

    box.innerText = text;

    box.className =
    "message " + type;

    box.style.display = "block";

}


function hideMessage(){

    const box =
    document.getElementById("message");

    box.style.display = "none";

}


// =====================================================
// LOGIN CHECK
// =====================================================

async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error){

        showMessage(
            "Login check failed: " +
            error.message,
            "error"
        );

        return false;

    }


    if(!data.session){

        showMessage(
            "Please login first.",
            "error"
        );

        addButton.disabled = true;

        return false;

    }


    currentUser =
    data.session.user;

    return true;

}


// =====================================================
// LOAD PRODUCTS
// =====================================================

async function loadProducts(){

    productSelect.innerHTML = `
        <option value="">
            Loading Products...
        </option>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        productSelect.innerHTML = `
            <option value="">
                Failed to load products
            </option>
        `;

        showMessage(
            "Products load failed: " +
            error.message,
            "error"
        );

        return;

    }


    products =
    data || [];


    productSelect.innerHTML = `
        <option value="">
            Select Product
        </option>
    `;


    products.forEach(function(product){

        const option =
        document.createElement("option");


        option.value =
        product.id;


        let text =
        product.name || "";


        if(product.code){

            text +=
            " [" +
            product.code +
            "]";

        }


        if(product.pack_size){

            text +=
            " - " +
            product.pack_size;

        }


        if(product.unit){

            text +=
            " " +
            product.unit;

        }


        option.textContent =
        text;


        productSelect.appendChild(
            option
        );

    });


    displayInventory();

}


// =====================================================
// DISPLAY INVENTORY
// =====================================================

function displayInventory(){

    inventoryTable.innerHTML = "";


    let totalStock = 0;

    let stockValue = 0;

    let lowStock = 0;


    if(products.length === 0){

        inventoryTable.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    No products found.

                </td>

            </tr>

        `;

    }


    products.forEach(function(product){

        const stock =
        Number(product.stock || 0);


        const tp =
        Number(product.tp || 0);


        const mrp =
        Number(product.mrp || 0);


        const value =
        stock * tp;


        totalStock +=
        stock;


        stockValue +=
        value;


        if(stock <= 10){

            lowStock++;

        }


        const status =
        stock <= 10

        ? `<span class="low">
            Low Stock
          </span>`

        : `<span class="good">
            Good
          </span>`;


        const row =
        document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHtml(product.name || "")}
            </td>

            <td>
                ${escapeHtml(product.code || "")}
            </td>

            <td>
                ৳ ${tp.toLocaleString()}
            </td>

            <td>
                ৳ ${mrp.toLocaleString()}
            </td>

            <td>
                ${stock.toLocaleString()}
            </td>

            <td>
                ৳ ${value.toLocaleString()}
            </td>

            <td>
                ${status}
            </td>

        `;


        inventoryTable.appendChild(row);

    });


    document.getElementById(
        "totalProducts"
    ).innerText =
    products.length;


    document.getElementById(
        "totalStock"
    ).innerText =
    totalStock.toLocaleString();


    document.getElementById(
        "stockValue"
    ).innerText =
    "৳ " +
    stockValue.toLocaleString();


    document.getElementById(
        "lowStock"
    ).innerText =
    lowStock;

}


// =====================================================
// ADD STOCK
// =====================================================

async function addStock(){

    hideMessage();


    const productId =
    productSelect.value;


    const quantity =
    Number(
        quantityInput.value
    );


    if(!productId){

        showMessage(
            "Please select a product.",
            "error"
        );

        return;

    }


    if(
        !Number.isInteger(quantity) ||
        quantity <= 0
    ){

        showMessage(
            "Please enter a valid whole quantity.",
            "error"
        );

        return;

    }


    const product =
    products.find(function(item){

        return String(item.id) ===
        String(productId);

    });


    if(!product){

        showMessage(
            "Product not found.",
            "error"
        );

        return;

    }


    addButton.disabled = true;

    addButton.innerText =
    "Saving...";


    try{

        // =============================================
        // OLD STOCK
        // =============================================

        const oldStock =
        Number(product.stock || 0);


        // =============================================
        // NEW STOCK
        // =============================================

        const newStock =
        oldStock + quantity;


        // =============================================
        // UPDATE PRODUCT STOCK
        // =============================================

        const {
            error: updateError
        } =
        await supabaseClient
            .from("products")
            .update({
                stock:newStock
            })
            .eq(
                "id",
                product.id
            );


        if(updateError){

            throw new Error(
                "Stock update failed: " +
                updateError.message
            );

        }


        // =============================================
        // SAVE STOCK MOVEMENT
        // =============================================

        const movementDate =
        new Date().toISOString();


        const {
            error: movementError
        } =
        await supabaseClient
            .from("stock_movements")
            .insert({

                product_id:
                product.id,

                product_name:
                product.name || "",

                product_code:
                product.code || "",

                "Pack size":
                product.pack_size || "",

                unit:
                product.unit || "",

                "Movement _type":
                "Stock In",

                quantity:
                quantity,

                "Customer _name":
                "",

                "Movement _date":
                movementDate,

                "Created_at":
                movementDate

            });


        if(movementError){

            // Restore old stock if movement fails

            await supabaseClient
                .from("products")
                .update({
                    stock:oldStock
                })
                .eq(
                    "id",
                    product.id
                );


            throw new Error(
                "Stock movement save failed: " +
                movementError.message
            );

        }


        // =============================================
        // UPDATE LOCAL MEMORY
        // =============================================

        product.stock =
        newStock;


        displayInventory();


        // =============================================
        // RESET
        // =============================================

        productSelect.value =
        "";

        quantityInput.value =
        "";


        // =============================================
        // SUCCESS
        // =============================================

        showMessage(
            "Stock added successfully!",
            "success"
        );


        await loadMovements();

    }


    catch(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }


    finally{

        addButton.disabled = false;

        addButton.innerText =
        "+ Add Stock";

    }

}


// =====================================================
// LOAD STOCK MOVEMENTS
// =====================================================

async function loadMovements(){

    movementTable.innerHTML = `

        <tr>

            <td
                colspan="4"
                class="empty">

                Loading...

            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("stock_movements")
        .select("*")
        .order(
            "Created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        movementTable.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    Stock movement load failed:
                    ${escapeHtml(error.message)}

                </td>

            </tr>

        `;

        return;

    }


    movementTable.innerHTML = "";


    if(!data || data.length === 0){

        movementTable.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    No stock movement found.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(function(item){

        const row =
        document.createElement("tr");


        // =============================================
        // MOVEMENT TYPE
        // =============================================

        const type =
        item["Movement _type"] || "";


        const typeClass =
        type.toLowerCase().includes("in")

        ? "stock-in"

        : "stock-out";


        // =============================================
        // DATE
        // =============================================

        let date = "";


        if(item["Movement _date"]){

            date =
            new Date(
                item["Movement _date"]
            ).toLocaleDateString();

        }


        else if(item["Created_at"]){

            date =
            new Date(
                item["Created_at"]
            ).toLocaleDateString();

        }


        // =============================================
        // ROW
        // =============================================

        row.innerHTML = `

            <td>
                ${escapeHtml(date)}
            </td>

            <td>
                ${escapeHtml(
                    item.product_name || ""
                )}
            </td>

            <td class="${typeClass}">
                ${escapeHtml(type)}
            </td>

            <td>
                ${Number(
                    item.quantity || 0
                ).toLocaleString()}
            </td>

        `;


        movementTable.appendChild(row);

    });

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard(){

    window.location.href =
    "dashboard.html";

}


// =====================================================
// START
// =====================================================

async function start(){

    const loggedIn =
    await checkLogin();


    if(!loggedIn){

        return;

    }


    await loadProducts();

    await loadMovements();

}


start();

</script>

</body>

</html>
