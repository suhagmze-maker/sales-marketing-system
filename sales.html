```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: white;
    color: #2563eb;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 25px;
    color: #222;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

input[readonly] {
    background: #f1f5f9;
}

.info {
    color: #666;
    font-size: 13px;
    margin-top: 6px;
}

.stock-info {
    margin-top: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #16a34a;
}

.total-box {
    background: #f1f5f9;
    padding: 18px;
    border-radius: 8px;
    margin-top: 20px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 16px;
}

.grand-total {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
    border-top: 1px solid #ddd;
    padding-top: 12px;
}

.save-btn {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.save-btn:hover {
    background: #1d4ed8;
}

.save-btn:disabled {
    background: #93c5fd;
    cursor: not-allowed;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    min-height: 20px;
}

.employee-box {
    background: #eef4ff;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 20px;
    color: #1d4ed8;
    font-weight: bold;
}

@media (max-width: 700px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h2>Sales Entry</h2>

    <button
        class="back-btn"
        onclick="goDashboard()">
        Dashboard
    </button>
</div>

<div class="container">

<div class="box">

<h1>New Sale</h1>

<div class="employee-box">
    Employee:
    <span id="employeeEmail">
        Checking login...
    </span>
</div>

<form id="salesForm">

<div class="form-grid">

<div>
<label>Customer Name</label>

<input
    type="text"
    id="customerName"
    list="customerSuggestions"
    placeholder="Type customer name"
    autocomplete="off"
    required>

<datalist id="customerSuggestions"></datalist>

<div class="info">
    Type customer name or select an existing customer.
</div>
</div>

<div>
<label>Sales Date</label>

<input
    type="date"
    id="salesDate"
    required>
</div>

<div class="full">

<label>Product</label>

<select id="product" required>
    <option value="">Select Product</option>
</select>

<div class="info">
    Product name, pack size and unit will appear automatically.
</div>

<div id="productInfo" class="info">
    Product: -
</div>

<div id="stockInfo" class="stock-info">
    Available Stock: 0
</div>

</div>

<div>
<label>TP</label>

<input
    type="number"
    id="tp"
    readonly>
</div>

<div>
<label>MRP</label>

<input
    type="number"
    id="mrp"
    readonly>
</div>

<div>
<label>Quantity</label>

<input
    type="number"
    id="quantity"
    placeholder="Enter quantity"
    min="1"
    required>
</div>

<div>
<label>Total Amount</label>

<input
    type="number"
    id="total"
    readonly>
</div>

</div>

<div class="total-box">

<div class="total-row">
    <span>Product:</span>
    <strong id="summaryProduct">-</strong>
</div>

<div class="total-row">
    <span>Pack Size:</span>
    <strong id="summaryPack">-</strong>
</div>

<div class="total-row">
    <span>Customer:</span>
    <strong id="summaryCustomer">-</strong>
</div>

<div class="total-row">
    <span>Quantity:</span>
    <strong id="summaryQuantity">0</strong>
</div>

<div class="total-row grand-total">
    <span>Total:</span>

    <strong>
        ৳ <span id="summaryTotal">0</span>
    </strong>
</div>

</div>

<button
    class="save-btn"
    id="saveButton"
    type="submit">
    Save Sale
</button>

</form>

<p id="message"></p>

</div>
</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const salesForm =
    document.getElementById("salesForm");

const customerNameInput =
    document.getElementById("customerName");

const customerSuggestions =
    document.getElementById("customerSuggestions");

const productSelect =
    document.getElementById("product");

const tpInput =
    document.getElementById("tp");

const mrpInput =
    document.getElementById("mrp");

const quantityInput =
    document.getElementById("quantity");

const totalInput =
    document.getElementById("total");

const stockInfo =
    document.getElementById("stockInfo");

const productInfo =
    document.getElementById("productInfo");

const saveButton =
    document.getElementById("saveButton");

const employeeEmail =
    document.getElementById("employeeEmail");

const message =
    document.getElementById("message");


/* =========================================
   LOCAL DATA
========================================= */

let customers =
    JSON.parse(
        localStorage.getItem("customers")
    ) || [];

let products =
    JSON.parse(
        localStorage.getItem("products")
    ) || [];

let currentUser = null;


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, color) {
    message.innerText = text;
    message.style.color = color;
}


/* =========================================
   LOGIN
========================================= */

async function checkLogin() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error) {
        showMessage(
            "Login error: " + error.message,
            "red"
        );
        return;
    }

    if (!data.session) {
        showMessage(
            "Please login first.",
            "red"
        );
        return;
    }

    currentUser =
        data.session.user;

    employeeEmail.innerText =
        currentUser.email || "Employee";
}

checkLogin();


/* =========================================
   DATE
========================================= */

const today =
    new Date()
        .toISOString()
        .split("T")[0];

document.getElementById(
    "salesDate"
).value = today;


/* =========================================
   CUSTOMER
========================================= */

function loadCustomerSuggestions() {

    customerSuggestions.innerHTML = "";

    customers.forEach(function(customer) {

        if (!customer.name) {
            return;
        }

        const option =
            document.createElement("option");

        option.value =
            customer.name;

        customerSuggestions.appendChild(
            option
        );
    });
}

loadCustomerSuggestions();


customerNameInput.addEventListener(
    "input",
    function() {

        document.getElementById(
            "summaryCustomer"
        ).innerText =
            this.value.trim() || "-";
    }
);


/* =========================================
   PRODUCTS
========================================= */

function loadProducts() {

    productSelect.innerHTML =
        '<option value="">Select Product</option>';

    products.forEach(
        function(product, index) {

            const option =
                document.createElement("option");

            option.value = index;

            let name =
                product.name || "";

            if (
                product.packSize ||
                product.unit
            ) {
                name +=
                    " - " +
                    (product.packSize || "") +
                    " " +
                    (product.unit || "");
            }

            if (product.code) {
                name +=
                    " [" +
                    product.code +
                    "]";
            }

            option.textContent = name;

            productSelect.appendChild(
                option
            );
        }
    );
}

loadProducts();


/* =========================================
   PRODUCT CHANGE
========================================= */

productSelect.addEventListener(
    "change",
    function() {

        const index = this.value;

        if (index === "") {

            tpInput.value = "";
            mrpInput.value = "";

            stockInfo.innerText =
                "Available Stock: 0";

            productInfo.innerText =
                "Product: -";

            document.getElementById(
                "summaryProduct"
            ).innerText = "-";

            document.getElementById(
                "summaryPack"
            ).innerText = "-";

            calculateTotal();

            return;
        }

        const product =
            products[index];

        if (!product) {
            showMessage(
                "Product not found.",
                "red"
            );
            return;
        }

        const tp =
            Number(product.tp || 0);

        const mrp =
            Number(product.mrp || 0);

        const stock =
            Number(product.stock || 0);

        tpInput.value = tp;
        mrpInput.value = mrp;

        const pack =
            (
                (product.packSize || "") +
                " " +
                (product.unit || "")
            ).trim();

        productInfo.innerText =
            "Product: " +
            (product.name || "") +
            (pack ? " | Pack: " + pack : "");

        stockInfo.innerText =
            "Available Stock: " +
            stock;

        stockInfo.style.color =
            stock <= 10
                ? "#dc2626"
                : "#16a34a";

        document.getElementById(
            "summaryProduct"
        ).innerText =
            product.name || "-";

        document.getElementById(
            "summaryPack"
        ).innerText =
            pack || "-";

        calculateTotal();
    }
);


/* =========================================
   TOTAL
========================================= */

quantityInput.addEventListener(
    "input",
    calculateTotal
);


function calculateTotal() {

    const quantity =
        Number(quantityInput.value || 0);

    const tp =
        Number(tpInput.value || 0);

    const total =
        quantity * tp;

    totalInput.value = total;

    document.getElementById(
        "summaryQuantity"
    ).innerText = quantity;

    document.getElementById(
        "summaryTotal"
    ).innerText =
        total.toLocaleString();
}


/* =========================================
   SAVE SALE
========================================= */

salesForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        if (!currentUser) {

            showMessage(
                "Please login first.",
                "red"
            );

            return;
        }

        const customerName =
            customerNameInput.value.trim();

        if (!customerName) {

            showMessage(
                "Please enter customer name.",
                "red"
            );

            return;
        }

        const productIndex =
            productSelect.value;

        if (productIndex === "") {

            showMessage(
                "Please select a product.",
                "red"
            );

            return;
        }

        const product =
            products[productIndex];

        if (!product) {

            showMessage(
                "Product not found.",
                "red"
            );

            return;
        }

        const quantity =
            Number(quantityInput.value);

        if (
            !Number.isFinite(quantity) ||
            quantity <= 0
        ) {

            showMessage(
                "Please enter a valid quantity.",
                "red"
            );

            return;
        }

        const stock =
            Number(product.stock || 0);

        if (stock <= 0) {

            showMessage(
                "This product is out of stock.",
                "red"
            );

            return;
        }

        if (quantity > stock) {

            showMessage(
                "Not enough stock. Available stock: " +
                stock,
                "red"
            );

            return;
        }

        const unitPrice =
            Number(product.tp || 0);

        const totalAmount =
            quantity * unitPrice;


        saveButton.disabled = true;

        saveButton.innerText =
            "Saving Order...";


        try {

            /* =====================================
               IMPORTANT:
               TABLE = orders
            ===================================== */

            const {
                error
            } =
            await supabaseClient
                .from("orders")
                .insert({
                    customer_name:
                        customerName,

                    employee_name:
                        currentUser.email || "",

                    product_name:
                        product.name || "",

                    quantity:
                        quantity,

                    unit_price:
                        unitPrice,

                    total_amount:
                        totalAmount
                });


            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                showMessage(
                    "Order save failed: " +
                    error.message,
                    "red"
                );

                return;
            }


            /* =====================================
               LOCAL CUSTOMER
            ===================================== */

            let customerIndex =
                customers.findIndex(
                    function(customer) {

                        return (
                            customer.name &&
                            customer.name
                                .toLowerCase() ===
                            customerName
                                .toLowerCase()
                        );
                    }
                );


            let customer;


            if (customerIndex === -1) {

                customer = {
                    name: customerName,
                    phone: "",
                    type: "Retailer",
                    address: ""
                };

                customers.push(customer);

                localStorage.setItem(
                    "customers",
                    JSON.stringify(
                        customers
                    )
                );

            } else {

                customer =
                    customers[
                        customerIndex
                    ];
            }


            /* =====================================
               REDUCE STOCK
            ===================================== */

            product.stock =
                stock - quantity;

            localStorage.setItem(
                "products",
                JSON.stringify(
                    products
                )
            );


            /* =====================================
               LOCAL SALES
            ===================================== */

            const sale = {

                customer:
                    customer.name,

                customerPhone:
                    customer.phone || "",

                product:
                    product.name || "",

                productCode:
                    product.code || "",

                category:
                    product.category || "",

                packSize:
                    product.packSize || "",

                unit:
                    product.unit || "",

                quantity:
                    quantity,

                tp:
                    unitPrice,

                mrp:
                    Number(product.mrp || 0),

                total:
                    totalAmount,

                date:
                    document.getElementById(
                        "salesDate"
                    ).value,

                employee:
                    currentUser.email || ""
            };


            let sales =
                JSON.parse(
                    localStorage.getItem("sales")
                ) || [];

            sales.push(sale);

            localStorage.setItem(
                "sales",
                JSON.stringify(sales)
            );


            /* =====================================
               STOCK MOVEMENT
            ===================================== */

            let movements =
                JSON.parse(
                    localStorage.getItem(
                        "stockMovements"
                    )
                ) || [];

            movements.push({

                date:
                    sale.date,

                product:
                    product.name || "",

                productCode:
                    product.code || "",

                category:
                    product.category || "",

                packSize:
                    product.packSize || "",

                unit:
                    product.unit || "",

                type:
                    "Stock Out",

                quantity:
                    quantity,

                customer:
                    customer.name,

                employee:
                    currentUser.email || ""
            });

            localStorage.setItem(
                "stockMovements",
                JSON.stringify(
                    movements
                )
            );


            /* =====================================
               SUCCESS
            ===================================== */

            showMessage(
                "✅ Order saved successfully!",
                "green"
            );


            salesForm.reset();

            document.getElementById(
                "salesDate"
            ).value = today;

            tpInput.value = "";
            mrpInput.value = "";
            totalInput.value = "";

            productInfo.innerText =
                "Product: -";

            stockInfo.innerText =
                "Available Stock: 0";

            stockInfo.style.color =
                "#16a34a";

            document.getElementById(
                "summaryProduct"
            ).innerText = "-";

            document.getElementById(
                "summaryPack"
            ).innerText = "-";

            document.getElementById(
                "summaryCustomer"
            ).innerText = "-";

            document.getElementById(
                "summaryQuantity"
            ).innerText = "0";

            document.getElementById(
                "summaryTotal"
            ).innerText = "0";

            loadCustomerSuggestions();

        }

        catch(error) {

            console.error(
                "Unexpected error:",
                error
            );

            showMessage(
                "Something went wrong: " +
                error.message,
                "red"
            );

        }

        finally {

            saveButton.disabled = false;

            saveButton.innerText =
                "Save Sale";
        }

    }
);


/* =========================================
   DASHBOARD
========================================= */

function goDashboard() {

    window.location.href =
        "dashboard.html";
}

</script>

</body>
</html>
```
