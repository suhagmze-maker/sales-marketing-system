```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sales & Marketing System - Login</title>


    <!-- =========================================
         SUPABASE LIBRARY
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }


        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }


        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }


        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }


        input:focus {
            border-color: #2563eb;
        }


        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }


        button:hover {
            background: #1d4ed8;
        }


        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }


        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }

    </style>

</head>


<body>


    <!-- =========================================
         LOGIN BOX
    ========================================== -->

    <div class="login-box">


        <h1>
            Welcome
        </h1>


        <p class="subtitle">
            Sales & Marketing System
        </p>


        <form id="loginForm">


            <label>
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton">

                Login

            </button>


        </form>


        <p id="message"></p>


    </div>



<script>


// =====================================================
// SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";


const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


// Create Supabase client

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// ELEMENTS
// =====================================================

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");



// =====================================================
// CHECK SUPABASE SESSION
// =====================================================

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            console.error(error);

            return;

        }


        if (data.session) {

            window.location.href =
                "dashboard.html";

        }

    }

    catch(error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


checkExistingSession();



// =====================================================
// LOGIN
// =====================================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password.",
                "red"
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.innerText =
            "Logging in...";

        message.innerText = "";



        try {


            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });



            if (error) {

                console.error(error);


                showMessage(
                    "Invalid email or password.",
                    "red"
                );


                loginButton.disabled =
                    false;

                loginButton.innerText =
                    "Login";


                return;

            }



            if (data.session) {


                showMessage(
                    "Login Successful!",
                    "green"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    500
                );


            }

        }

        catch(error) {

            console.error(error);


            showMessage(
                "Something went wrong. Please try again.",
                "red"
            );


            loginButton.disabled =
                false;

            loginButton.innerText =
                "Login";

        }

    }
);



// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    color
) {

    message.innerText =
        text;

    message.style.color =
        color;

}



// =====================================================
// ENTER KEY SUPPORT
// =====================================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loginForm.requestSubmit();

        }

    }
);

</script>


</body>

</html>
