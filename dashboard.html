<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales & Marketing Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#1d4ed8,#4f46e5);
    color:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 15px rgba(37,99,235,.25);
}

.header h2{
    font-size:22px;
}

.logout{
    background:white;
    color:#1d4ed8;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.logout:hover{
    transform:translateY(-2px);
}

.logout:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* ================= CONTAINER ================= */

.container{
    padding:30px;
    max-width:1450px;
    margin:auto;
}

/* ================= WELCOME ================= */

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    margin-bottom:8px;
    color:#111827;
    font-size:30px;
}

.welcome p{
    color:#64748b;
}

/* ================= CARDS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    position:relative;
    overflow:hidden;
    padding:25px;
    border-radius:16px;
    color:white;
    min-height:145px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    font-size:16px;
    margin-bottom:15px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.sales-card{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.customer-card{
    background:linear-gradient(135deg,#059669,#10b981);
}

.product-card{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
}

.today-card{
    background:linear-gradient(135deg,#ea580c,#f97316);
}

/* ================= STATUS ================= */

.status{
    margin-top:25px;
    padding:13px 17px;
    border-radius:9px;
    background:#eef4ff;
    color:#2563eb;
    font-weight:bold;
    border-left:5px solid #2563eb;
}

/* ================= REFRESH ================= */

.refresh-box{
    margin-top:20px;
    text-align:right;
}

.refresh-btn{
    padding:11px 20px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#059669,#10b981);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* ================= MENU ================= */

.menu{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.menu-button{
    display:flex !important;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:70px;
    padding:20px 15px;

    border:none;
    border-radius:14px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    transition:.25s;

    visibility:visible !important;
    opacity:1 !important;
}

.menu-button:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,.14);
}

/* ================= BUTTON COLORS ================= */

.sales-entry{
    background:#dbeafe !important;
    color:#1d4ed8 !important;
}

.sales-history{
    background:#dcfce7 !important;
    color:#15803d !important;
}

.customers{
    background:#f3e8ff !important;
    color:#7e22ce !important;
}

.products{
    background:#fef3c7 !important;
    color:#b45309 !important;
}

.inventory{
    background:#cffafe !important;
    color:#0e7490 !important;
}

.reports{
    background:#fce7f3 !important;
    color:#be185d !important;
}

.marketing{
    background:#ffedd5 !important;
    color:#c2410c !important;
}

.outlet-survey{
    background:#dcfce7 !important;
    color:#166534 !important;
    border:2px solid #22c55e !important;
}

.settings{
    background:#e0e7ff !important;
    color:#4338ca !important;
    border:2px solid #6366f1 !important;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header{
        padding:15px 18px;
    }

    .header h2{
        font-size:17px;
    }

    .container{
        padding:20px 15px;
    }

    .welcome h1{
        font-size:25px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .menu{
        grid-template-columns:1fr;
    }

    .card{
        min-height:135px;
    }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <h2>
        Sales & Marketing System
    </h2>

    <button
        class="logout"
        id="logoutButton">

        Logout

    </button>

</div>


<div class="container">

<!-- ================= WELCOME ================= -->

<div class="welcome">

    <h1>
        Dashboard
    </h1>

    <p id="welcomeText">
        Loading user...
    </p>

</div>


<!-- ================= DASHBOARD CARDS ================= -->

<div class="cards">

    <div class="card sales-card">

        <h3>
            💰 Total Sales
        </h3>

        <div
            class="number"
            id="totalSales">

            ৳ 0

        </div>

    </div>


    <div class="card customer-card">

        <h3>
            👥 Total Customers
        </h3>

        <div
            class="number"
            id="totalCustomers">

            0

        </div>

    </div>


    <div class="card product-card">

        <h3>
            📦 Total Products
        </h3>

        <div
            class="number"
            id="totalProducts">

            0

        </div>

    </div>


    <div class="card today-card">

        <h3>
            📅 Today's Sales
        </h3>

        <div
            class="number"
            id="todaySales">

            ৳ 0

        </div>

    </div>

</div>


<!-- ================= STATUS ================= -->

<div
    id="status"
    class="status">

    Loading live data from Supabase...

</div>


<!-- ================= REFRESH ================= -->

<div class="refresh-box">

    <button
        class="refresh-btn"
        id="refreshButton">

        🔄 Refresh Dashboard

    </button>

</div>


<!-- ================= MENU ================= -->

<div class="menu">

    <button
        class="menu-button sales-entry"
        onclick="go('sales.html')">

        📊 Sales Entry

    </button>


    <button
        class="menu-button sales-history"
        onclick="go('sales-history.html')">

        📋 Sales History

    </button>


    <button
        class="menu-button customers"
        onclick="go('customers.html')">

        👥 Customers

    </button>


    <button
        class="menu-button products"
        onclick="go('products.html')">

        📦 Products

    </button>


    <button
        class="menu-button inventory"
        onclick="go('inventory.html')">

        📋 Inventory

    </button>


    <button
        class="menu-button reports"
        onclick="go('reports.html')">

        📈 Reports

    </button>


    <button
        class="menu-button marketing"
        onclick="go('marketing.html')">

        📢 Marketing

    </button>


    <button
        class="menu-button outlet-survey"
        onclick="go('outlet-survey.html')">

        🏪 Outlet Survey

    </button>


    <button
        class="menu-button settings"
        onclick="go('settings.html')">

        ⚙️ Settings

    </button>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const welcomeText =
    document.getElementById("welcomeText");

const statusBox =
    document.getElementById("status");


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if(error){

        console.error(
            "Session error:",
            error
        );

        window.location.replace("index.html");

        return null;
    }


    if(!data.session){

        window.location.replace("index.html");

        return null;
    }


    const user =
        data.session.user;


    if(user && user.email){

        welcomeText.innerText =
            "Welcome, " +
            user.email +
            " — Sales & Marketing Management System.";

    }


    return user;

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

    statusBox.innerText =
        "Loading live data from Supabase...";

    statusBox.style.background =
        "#eef4ff";

    statusBox.style.color =
        "#2563eb";

    statusBox.style.borderLeftColor =
        "#2563eb";


    try{

        const user =
            await checkLogin();


        if(!user){

            return;

        }


        /* ================= CUSTOMERS ================= */

        const customersResult =
            await supabaseClient
                .from("customers")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                );


        if(customersResult.error){

            throw new Error(
                "Customers: " +
                customersResult.error.message
            );

        }


        document.getElementById(
            "totalCustomers"
        ).innerText =
            (
                customersResult.count || 0
            ).toLocaleString();


        /* ================= PRODUCTS ================= */

        const productsResult =
            await supabaseClient
                .from("products")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                );


        if(productsResult.error){

            throw new Error(
                "Products: " +
                productsResult.error.message
            );

        }


        document.getElementById(
            "totalProducts"
        ).innerText =
            (
                productsResult.count || 0
            ).toLocaleString();


        /* ================= SALES ================= */

        const salesResult =
            await supabaseClient
                .from("orders")
                .select(
                    "total_amount,created_at"
                );


        if(salesResult.error){

            throw new Error(
                "Sales: " +
                salesResult.error.message
            );

        }


        const sales =
            salesResult.data || [];


        /* ================= TOTAL SALES ================= */

        let totalSales = 0;


        sales.forEach(function(sale){

            totalSales +=
                Number(
                    sale.total_amount || 0
                );

        });


        document.getElementById(
            "totalSales"
        ).innerText =
            "৳ " +
            totalSales.toLocaleString();


        /* ================= TODAY SALES ================= */

        const now =
            new Date();


        const today =
            now.getFullYear() +
            "-" +
            String(
                now.getMonth() + 1
            ).padStart(2,"0") +
            "-" +
            String(
                now.getDate()
            ).padStart(2,"0");


        let todaySales = 0;


        sales.forEach(function(sale){

            if(!sale.created_at){

                return;

            }


            const date =
                new Date(
                    sale.created_at
                );


            const saleDate =
                date.getFullYear() +
                "-" +
                String(
                    date.getMonth() + 1
                ).padStart(2,"0") +
                "-" +
                String(
                    date.getDate()
                ).padStart(2,"0");


            if(saleDate === today){

                todaySales +=
                    Number(
                        sale.total_amount || 0
                    );

            }

        });


        document.getElementById(
            "todaySales"
        ).innerText =
            "৳ " +
            todaySales.toLocaleString();


        /* ================= SUCCESS ================= */

        statusBox.innerText =
            "✓ Live Supabase data loaded successfully.";

        statusBox.style.background =
            "#dcfce7";

        statusBox.style.color =
            "#166534";

        statusBox.style.borderLeftColor =
            "#16a34a";

    }

    catch(error){

        console.error(
            "Dashboard error:",
            error
        );


        statusBox.innerText =
            "Dashboard load failed: " +
            error.message;

        statusBox.style.background =
            "#fee2e2";

        statusBox.style.color =
            "#b91c1c";

        statusBox.style.borderLeftColor =
            "#dc2626";

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    logoutButton.disabled = true;

    logoutButton.innerText =
        "Logging out...";


    try{

        const {
            error
        } =
        await supabaseClient.auth.signOut();


        if(error){

            alert(
                "Logout failed: " +
                error.message
            );

            logoutButton.disabled =
                false;

            logoutButton.innerText =
                "Logout";

            return;

        }


        window.location.replace(
            "index.html"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "Something went wrong."
        );

        logoutButton.disabled =
            false;

        logoutButton.innerText =
            "Logout";

    }

}


/* =====================================================
   LOGOUT BUTTON
===================================================== */

logoutButton.addEventListener(
    "click",
    logout
);


/* =====================================================
   NAVIGATION
===================================================== */

function go(page){

    console.log(
        "Opening:",
        page
    );

    window.location.href =
        page;

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

refreshButton.addEventListener(
    "click",
    async function(){

        refreshButton.disabled =
            true;

        refreshButton.innerText =
            "⏳ Loading...";


        await loadDashboard();


        refreshButton.disabled =
            false;

        refreshButton.innerText =
            "🔄 Refresh Dashboard";

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadDashboard();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadDashboard,
    10000
);

</script>

</body>

</html>
