<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
      content="no-cache">

<meta http-equiv="Expires"
      content="0">

<title>Sales & Marketing Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body{
    background:linear-gradient(
        135deg,
        #eef2ff,
        #f8fafc
    );

    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:linear-gradient(
        135deg,
        #1d4ed8,
        #4f46e5
    );

    color:white;

    padding:20px 30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:
        0 4px 15px rgba(37,99,235,.25);

}

.header h2{

    font-size:22px;

}


/* =====================================================
   LOGOUT
===================================================== */

.logout{

    background:white;

    color:#1d4ed8;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;

}

.logout:hover{

    transform:translateY(-2px);

    box-shadow:
        0 4px 10px rgba(0,0,0,.15);

}

.logout:disabled{

    opacity:.7;

    cursor:not-allowed;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    padding:30px;

    max-width:1450px;

    margin:auto;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

    margin-bottom:25px;

}

.welcome h1{

    margin-bottom:8px;

    color:#111827;

    font-size:30px;

}

.welcome p{

    color:#64748b;

}


/* =====================================================
   DASHBOARD CARDS
===================================================== */

.cards{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:20px;

}


/* =====================================================
   COMMON CARD
===================================================== */

.card{

    position:relative;

    overflow:hidden;

    padding:25px;

    border-radius:16px;

    color:white;

    min-height:145px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);

    transition:.25s;

}

.card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 12px 25px rgba(0,0,0,.18);

}

.card h3{

    font-size:16px;

    margin-bottom:15px;

    opacity:.95;

}

.number{

    font-size:30px;

    font-weight:bold;

}


/* =====================================================
   CARD COLORS
===================================================== */

.sales-card{

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6
        );

}

.customer-card{

    background:
        linear-gradient(
            135deg,
            #059669,
            #10b981
        );

}

.product-card{

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

}

.today-card{

    background:
        linear-gradient(
            135deg,
            #ea580c,
            #f97316
        );

}


/* =====================================================
   CARD DECORATION
===================================================== */

.card::after{

    content:"";

    position:absolute;

    width:100px;

    height:100px;

    right:-30px;

    bottom:-35px;

    background:
        rgba(255,255,255,.15);

    border-radius:50%;

}

.card::before{

    content:"";

    position:absolute;

    width:55px;

    height:55px;

    right:45px;

    top:-20px;

    background:
        rgba(255,255,255,.08);

    border-radius:50%;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin-top:25px;

    padding:13px 17px;

    border-radius:9px;

    background:#eef4ff;

    color:#2563eb;

    font-weight:bold;

    border-left:
        5px solid #2563eb;

}


/* =====================================================
   REFRESH BOX
===================================================== */

.refresh-box{

    margin-top:20px;

    text-align:right;

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

.refresh-btn{

    padding:11px 20px;

    border:none;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #059669,
            #10b981
        );

    color:white;

    cursor:pointer;

    font-weight:bold;

    box-shadow:
        0 4px 10px
        rgba(16,185,129,.25);

    transition:.2s;

}

.refresh-btn:hover{

    transform:translateY(-2px);

}

.refresh-btn:disabled{

    opacity:.7;

}


/* =====================================================
   MENU
===================================================== */

.menu{

    margin-top:25px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

}


/* =====================================================
   ALL MENU BUTTONS
===================================================== */

.menu-button{

    display:flex !important;

    visibility:visible !important;

    opacity:1 !important;

    width:100%;

    min-height:70px;

    align-items:center;

    justify-content:center;

    padding:22px 15px;

    border:none;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.08);

    transition:.25s;

}

.menu-button:hover{

    transform:translateY(-4px);

    box-shadow:
        0 10px 20px rgba(0,0,0,.14);

}


/* =====================================================
   SALES ENTRY
===================================================== */

.sales-entry-btn{

    background:#dbeafe;

    color:#1d4ed8;

}


/* =====================================================
   SALES HISTORY
===================================================== */

.sales-history-btn{

    background:#dcfce7;

    color:#15803d;

}


/* =====================================================
   CUSTOMERS
===================================================== */

.customers-btn{

    background:#f3e8ff;

    color:#7e22ce;

}


/* =====================================================
   PRODUCTS
===================================================== */

.products-btn{

    background:#fef3c7;

    color:#b45309;

}


/* =====================================================
   INVENTORY
===================================================== */

.inventory-btn{

    background:#cffafe;

    color:#0e7490;

}


/* =====================================================
   REPORTS
===================================================== */

.reports-btn{

    background:#fce7f3;

    color:#be185d;

}


/* =====================================================
   MARKETING
===================================================== */

.marketing-btn{

    background:#ffedd5;

    color:#c2410c;

}


/* =====================================================
   OUTLET SURVEY
===================================================== */

.outlet-survey-btn{

    display:flex !important;

    visibility:visible !important;

    opacity:1 !important;

    background:#dcfce7 !important;

    color:#166534 !important;

    border:2px solid #22c55e !important;

    min-height:70px;

}


/* =====================================================
   SETTINGS
===================================================== */

.settings-btn{

    display:flex !important;

    visibility:visible !important;

    opacity:1 !important;

    background:#e0e7ff !important;

    color:#4338ca !important;

    border:2px solid #6366f1 !important;

    min-height:70px;

}


/* =====================================================
   MOBILE / TABLET
===================================================== */

@media(max-width:1000px){

    .cards{

        grid-template-columns:
            repeat(2,1fr);

    }

    .menu{

        grid-template-columns:
            repeat(2,1fr);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

        padding:
            15px 18px;

    }

    .header h2{

        font-size:17px;

    }

    .container{

        padding:
            20px 15px;

    }

    .welcome h1{

        font-size:25px;

    }

    .cards{

        grid-template-columns:
            1fr;

    }

    .menu{

        grid-template-columns:
            1fr;

    }

    .card{

        min-height:135px;

    }

    .menu-button{

        min-height:65px;

    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .header{

        gap:10px;

    }

    .logout{

        padding:
            8px 12px;

    }

    .menu-button{

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>
        Sales & Marketing System
    </h2>

    <button
        type="button"
        class="logout"
        id="logoutButton">

        Logout

    </button>

</div>


<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<div class="container">


    <!-- =================================================
         WELCOME
    ================================================== -->

    <div class="welcome">

        <h1>
            Dashboard
        </h1>

        <p id="welcomeText">
            Loading user...
        </p>

    </div>


    <!-- =================================================
         CARDS
    ================================================== -->

    <div class="cards">


        <!-- TOTAL SALES -->

        <div class="card sales-card">

            <h3>
                💰 Total Sales
            </h3>

            <div
                class="number"
                id="totalSales">

                ৳ 0

            </div>

        </div>


        <!-- TOTAL CUSTOMERS -->

        <div class="card customer-card">

            <h3>
                👥 Total Customers
            </h3>

            <div
                class="number"
                id="totalCustomers">

                0

            </div>

        </div>


        <!-- TOTAL PRODUCTS -->

        <div class="card product-card">

            <h3>
                📦 Total Products
            </h3>

            <div
                class="number"
                id="totalProducts">

                0

            </div>

        </div>


        <!-- TODAY SALES -->

        <div class="card today-card">

            <h3>
                📅 Today's Sales
            </h3>

            <div
                class="number"
                id="todaySales">

                ৳ 0

            </div>

        </div>


    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="status"
        class="status">

        Loading live data from Supabase...

    </div>


    <!-- =================================================
         REFRESH
    ================================================== -->

    <div class="refresh-box">

        <button
            type="button"
            class="refresh-btn"
            id="refreshButton">

            🔄 Refresh Dashboard

        </button>

    </div>


    <!-- =================================================
         MENU
    ================================================== -->

    <div class="menu">


        <!-- 1 SALES ENTRY -->

        <button
            type="button"
            class="menu-button sales-entry-btn"
            onclick="go('sales.html')">

            💰 Sales Entry

        </button>


        <!-- 2 SALES HISTORY -->

        <button
            type="button"
            class="menu-button sales-history-btn"
            onclick="go('sales-history.html')">

            🧾 Sales History

        </button>


        <!-- 3 CUSTOMERS -->

        <button
            type="button"
            class="menu-button customers-btn"
            onclick="go('customers.html')">

            👤 Customers

        </button>


        <!-- 4 PRODUCTS -->

        <button
            type="button"
            class="menu-button products-btn"
            onclick="go('products.html')">

            🏷️ Products

        </button>


        <!-- 5 INVENTORY -->

        <button
            type="button"
            class="menu-button inventory-btn"
            onclick="go('inventory.html')">

            📦 Inventory

        </button>


        <!-- 6 REPORTS -->

        <button
            type="button"
            class="menu-button reports-btn"
            onclick="go('reports.html')">

            📊 Reports

        </button>


        <!-- 7 MARKETING -->

        <button
            type="button"
            class="menu-button marketing-btn"
            onclick="go('marketing.html')">

            📣 Marketing

        </button>


        <!-- 8 OUTLET SURVEY -->

        <button
            type="button"
            id="outletSurveyButton"
            class="menu-button outlet-survey-btn"
            onclick="go('outlet-survey.html')">

            🏪 Outlet Survey

        </button>


        <!-- 9 SETTINGS -->

        <button
            type="button"
            id="settingsButton"
            class="menu-button settings-btn"
            onclick="go('settings.html')">

            ⚙️ Settings

        </button>


    </div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const welcomeText =
    document.getElementById(
        "welcomeText"
    );

const statusBox =
    document.getElementById(
        "status"
    );


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error){

        console.error(
            "Session error:",
            error
        );

        window.location.href =
            "index.html";

        return null;

    }


    if(!data.session){

        window.location.href =
            "index.html";

        return null;

    }


    const user =
        data.session.user;


    if(
        user &&
        user.email
    ){

        welcomeText.innerText =
            "Welcome, " +
            user.email +
            " — Sales & Marketing Management System.";

    }


    return user;

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

    statusBox.innerText =
        "Loading live data from Supabase...";


    statusBox.style.background =
        "#eef4ff";

    statusBox.style.color =
        "#2563eb";

    statusBox.style.borderLeftColor =
        "#2563eb";


    try{

        const user =
            await checkLogin();


        if(!user){

            return;

        }


        /* =============================================
           CUSTOMERS
        ============================================= */

        const customersResult =
            await supabaseClient
                .from("customers")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                );


        if(
            customersResult.error
        ){

            throw new Error(
                "Customers: " +
                customersResult.error.message
            );

        }


        document.getElementById(
            "totalCustomers"
        ).innerText =
            (
                customersResult.count || 0
            ).toLocaleString();


        /* =============================================
           PRODUCTS
        ============================================= */

        const productsResult =
            await supabaseClient
                .from("products")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                );


        if(
            productsResult.error
        ){

            throw new Error(
                "Products: " +
                productsResult.error.message
            );

        }


        document.getElementById(
            "totalProducts"
        ).innerText =
            (
                productsResult.count || 0
            ).toLocaleString();


        /* =============================================
           ORDERS
        ============================================= */

        const salesResult =
            await supabaseClient
                .from("orders")
                .select(
                    "total_amount,created_at"
                );


        if(
            salesResult.error
        ){

            throw new Error(
                "Sales: " +
                salesResult.error.message
            );

        }


        const sales =
            salesResult.data || [];


        /* =============================================
           TOTAL SALES
        ============================================= */

        let totalSales = 0;


        sales.forEach(
            function(sale){

                totalSales +=
                    Number(
                        sale.total_amount || 0
                    );

            }
        );


        document.getElementById(
            "totalSales"
        ).innerText =
            "৳ " +
            totalSales.toLocaleString();


        /* =============================================
           TODAY SALES
        ============================================= */

        const now =
            new Date();


        const today =
            now.getFullYear() +
            "-" +
            String(
                now.getMonth() + 1
            ).padStart(2,"0") +
            "-" +
            String(
                now.getDate()
            ).padStart(2,"0");


        let todaySales = 0;


        sales.forEach(
            function(sale){

                if(
                    !sale.created_at
                ){

                    return;

                }


                const date =
                    new Date(
                        sale.created_at
                    );


                const saleDate =
                    date.getFullYear() +
                    "-" +
                    String(
                        date.getMonth() + 1
                    ).padStart(2,"0") +
                    "-" +
                    String(
                        date.getDate()
                    ).padStart(2,"0");


                if(
                    saleDate === today
                ){

                    todaySales +=
                        Number(
                            sale.total_amount || 0
                        );

                }

            }
        );


        document.getElementById(
            "todaySales"
        ).innerText =
            "৳ " +
            todaySales.toLocaleString();


        /* =============================================
           SUCCESS
        ============================================= */

        statusBox.innerText =
            "✓ Live Supabase data loaded successfully.";

        statusBox.style.background =
            "#dcfce7";

        statusBox.style.color =
            "#166534";

        statusBox.style.borderLeftColor =
            "#16a34a";


    }

    catch(error){

        console.error(
            "Dashboard error:",
            error
        );


        statusBox.innerText =
            "Dashboard load failed: " +
            error.message;


        statusBox.style.background =
            "#fee2e2";

        statusBox.style.color =
            "#b91c1c";

        statusBox.style.borderLeftColor =
            "#dc2626";

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    logoutButton.disabled =
        true;

    logoutButton.innerText =
        "Logging out...";


    try{

        const {
            error
        } =
        await supabaseClient.auth.signOut();


        if(error){

            alert(
                "Logout failed: " +
                error.message
            );


            logoutButton.disabled =
                false;

            logoutButton.innerText =
                "Logout";

            return;

        }


        window.location.replace(
            "index.html"
        );

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "Something went wrong."
        );


        logoutButton.disabled =
            false;

        logoutButton.innerText =
            "Logout";

    }

}


/* =====================================================
   LOGOUT BUTTON
===================================================== */

logoutButton.addEventListener(
    "click",
    logout
);


/* =====================================================
   NAVIGATION
===================================================== */

function go(page){

    window.location.href =
        page;

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

refreshButton.addEventListener(
    "click",
    async function(){

        refreshButton.disabled =
            true;

        refreshButton.innerText =
            "⏳ Loading...";


        await loadDashboard();


        refreshButton.disabled =
            false;

        refreshButton.innerText =
            "🔄 Refresh Dashboard";

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadDashboard();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadDashboard,
    10000
);


/* =====================================================
   FORCE BUTTON VISIBILITY
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const outletButton =
            document.getElementById(
                "outletSurveyButton"
            );

        const settingsButton =
            document.getElementById(
                "settingsButton"
            );


        if(outletButton){

            outletButton.style.display =
                "flex";

            outletButton.style.visibility =
                "visible";

            outletButton.style.opacity =
                "1";

        }


        if(settingsButton){

            settingsButton.style.display =
                "flex";

            settingsButton.style.visibility =
                "visible";

            settingsButton.style.opacity =
                "1";

        }

    }
);

</script>

</body>

</html>
