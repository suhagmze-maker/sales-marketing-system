```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales & Marketing Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 22px;
}

.logout {
    background: white;
    color: #2563eb;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.logout:hover {
    background: #eef4ff;
}

.logout:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.container {
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    margin-bottom: 8px;
    color: #222;
}

.welcome p {
    color: #666;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
    color: #666;
    margin-bottom: 12px;
}

.number {
    font-size: 28px;
    font-weight: bold;
    color: #2563eb;
}

.menu {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.menu button {
    padding: 20px;
    border: none;
    background: white;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.menu button:hover {
    background: #eef4ff;
    transform: translateY(-2px);
}

.refresh-box {
    margin-top: 25px;
    text-align: right;
}

.refresh-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #15803d;
}

.status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 7px;
    background: #eef4ff;
    color: #2563eb;
    font-weight: bold;
}

@media (max-width: 900px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .header {
        padding: 15px;
    }

    .header h2 {
        font-size: 17px;
    }

    .logout {
        padding: 8px 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h2>
        Sales & Marketing System
    </h2>

    <button
        class="logout"
        id="logoutButton">

        Logout

    </button>

</div>



<div class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            Dashboard
        </h1>

        <p id="welcomeText">
            Loading user...
        </p>

    </div>



    <!-- CARDS -->

    <div class="cards">


        <div class="card">

            <h3>
                Total Sales
            </h3>

            <div
                class="number"
                id="totalSales">

                ৳ 0

            </div>

        </div>



        <div class="card">

            <h3>
                Total Customers
            </h3>

            <div
                class="number"
                id="totalCustomers">

                0

            </div>

        </div>



        <div class="card">

            <h3>
                Total Products
            </h3>

            <div
                class="number"
                id="totalProducts">

                0

            </div>

        </div>



        <div class="card">

            <h3>
                Today's Sales
            </h3>

            <div
                class="number"
                id="todaySales">

                ৳ 0

            </div>

        </div>


    </div>



    <!-- STATUS -->

    <div
        id="status"
        class="status">

        Loading dashboard data...

    </div>



    <!-- REFRESH -->

    <div class="refresh-box">

        <button
            class="refresh-btn"
            id="refreshButton">

            🔄 Refresh Dashboard

        </button>

    </div>



    <!-- MENU -->

    <div class="menu">


        <button onclick="go('sales.html')">
            📊 Sales Entry
        </button>


        <button onclick="go('sales-history.html')">
            📋 Sales History
        </button>


        <button onclick="go('customers.html')">
            👥 Customers
        </button>


        <button onclick="go('products.html')">
            📦 Products
        </button>


        <button onclick="go('inventory.html')">
            📋 Inventory
        </button>


        <button onclick="go('reports.html')">
            📈 Reports
        </button>


        <button onclick="go('marketing.html')">
            📢 Marketing
        </button>


        <button onclick="go('settings.html')">
            ⚙️ Settings
        </button>


    </div>

</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// ELEMENTS
// =====================================================

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const welcomeText =
    document.getElementById(
        "welcomeText"
    );

const statusBox =
    document.getElementById(
        "status"
    );



// =====================================================
// CHECK LOGIN
// =====================================================

async function checkLogin() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        window.location.href =
            "index.html";

        return null;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return null;

    }


    const user =
        data.session.user;


    if (user && user.email) {

        welcomeText.innerText =
            "Welcome, " +
            user.email +
            " — Sales & Marketing Management System.";

    }


    return user;

}



// =====================================================
// LOAD DASHBOARD FROM SUPABASE
// =====================================================

async function loadDashboard() {

    statusBox.innerText =
        "Loading live data from Supabase...";

    statusBox.style.background =
        "#eef4ff";

    statusBox.style.color =
        "#2563eb";


    try {

        // =============================================
        // CHECK LOGIN FIRST
        // =============================================

        const user =
            await checkLogin();


        if (!user) {
            return;
        }



        // =============================================
        // LOAD ALL DATA
        // =============================================

        const [
            customersResult,
            productsResult,
            salesResult
        ] =
        await Promise.all([


            // CUSTOMERS

            supabaseClient
                .from("customers")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                ),



            // PRODUCTS

            supabaseClient
                .from("products")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                ),



            // SALES

            supabaseClient
                .from("orders")
                .select(
                    "total_amount,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )

        ]);



        // =============================================
        // CHECK CUSTOMER ERROR
        // =============================================

        if (
            customersResult.error
        ) {

            throw new Error(
                "Customers: " +
                customersResult.error.message
            );

        }



        // =============================================
        // CHECK PRODUCT ERROR
        // =============================================

        if (
            productsResult.error
        ) {

            throw new Error(
                "Products: " +
                productsResult.error.message
            );

        }



        // =============================================
        // CHECK SALES ERROR
        // =============================================

        if (
            salesResult.error
        ) {

            throw new Error(
                "Sales: " +
                salesResult.error.message
            );

        }



        // =============================================
        // CUSTOMER COUNT
        // =============================================

        const customerCount =
            customersResult.count || 0;


        document.getElementById(
            "totalCustomers"
        ).innerText =
            customerCount.toLocaleString();



        // =============================================
        // PRODUCT COUNT
        // =============================================

        const productCount =
            productsResult.count || 0;


        document.getElementById(
            "totalProducts"
        ).innerText =
            productCount.toLocaleString();



        // =============================================
        // SALES DATA
        // =============================================

        const sales =
            salesResult.data || [];



        // =============================================
        // TOTAL SALES
        // =============================================

        let totalSales = 0;


        sales.forEach(
            function(sale) {

                totalSales +=
                    Number(
                        sale.total_amount || 0
                    );

            }
        );


        document.getElementById(
            "totalSales"
        ).innerText =
            "৳ " +
            totalSales.toLocaleString();



        // =============================================
        // TODAY SALES
        // =============================================

        const now =
            new Date();


        const today =
            now.getFullYear() +
            "-" +
            String(
                now.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                now.getDate()
            ).padStart(2, "0");


        let todaySales = 0;


        sales.forEach(
            function(sale) {

                if (
                    !sale.created_at
                ) {

                    return;

                }


                const date =
                    new Date(
                        sale.created_at
                    );


                const saleDate =
                    date.getFullYear() +
                    "-" +
                    String(
                        date.getMonth() + 1
                    ).padStart(2, "0") +
                    "-" +
                    String(
                        date.getDate()
                    ).padStart(2, "0");


                if (
                    saleDate === today
                ) {

                    todaySales +=
                        Number(
                            sale.total_amount || 0
                        );

                }

            }
        );


        document.getElementById(
            "todaySales"
        ).innerText =
            "৳ " +
            todaySales.toLocaleString();



        // =============================================
        // SUCCESS
        // =============================================

        statusBox.innerText =
            "✓ Live Supabase data loaded successfully.";


        statusBox.style.background =
            "#dcfce7";

        statusBox.style.color =
            "#166534";


    }

    catch(error) {

        console.error(
            "Dashboard error:",
            error
        );


        statusBox.innerText =
            "Dashboard load failed: " +
            error.message;


        statusBox.style.background =
            "#fee2e2";

        statusBox.style.color =
            "#b91c1c";

    }

}



// =====================================================
// LOGOUT
// =====================================================

async function logout() {

    logoutButton.disabled =
        true;

    logoutButton.innerText =
        "Logging out...";


    try {

        const {
            error
        } =
        await supabaseClient.auth.signOut();


        if (error) {

            alert(
                "Logout failed: " +
                error.message
            );

            logoutButton.disabled =
                false;

            logoutButton.innerText =
                "Logout";

            return;

        }


        window.location.replace(
            "index.html"
        );

    }

    catch(error) {

        console.error(
            error
        );

        alert(
            "Something went wrong."
        );

        logoutButton.disabled =
            false;

        logoutButton.innerText =
            "Logout";

    }

}



// =====================================================
// LOGOUT BUTTON
// =====================================================

logoutButton.addEventListener(
    "click",
    logout
);



// =====================================================
// NAVIGATION
// =====================================================

function go(page) {

    window.location.href =
        page;

}



// =====================================================
// REFRESH
// =====================================================

refreshButton.addEventListener(
    "click",
    async function() {

        refreshButton.disabled =
            true;

        refreshButton.innerText =
            "⏳ Loading...";


        await loadDashboard();


        refreshButton.disabled =
            false;

        refreshButton.innerText =
            "🔄 Refresh Dashboard";

    }
);



// =====================================================
// INITIAL LOAD
// =====================================================

loadDashboard();



// =====================================================
// AUTO REFRESH
// Every 10 seconds
// =====================================================

setInterval(
    loadDashboard,
    10000
);

</script>

</body>

</html>
