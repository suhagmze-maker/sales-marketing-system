```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sales & Marketing Dashboard</title>


<!-- =====================================================
     SUPABASE LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    background: #2563eb;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 22px;
}

.logout {
    background: white;
    color: #2563eb;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.logout:hover {
    background: #eef4ff;
}

.logout:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    margin-bottom: 8px;
    color: #222;
}

.welcome p {
    color: #666;
}


/* =====================================================
   CARDS
===================================================== */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
    color: #666;
    margin-bottom: 12px;
}

.number {
    font-size: 28px;
    font-weight: bold;
    color: #2563eb;
}


/* =====================================================
   MENU
===================================================== */

.menu {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.menu button {
    padding: 20px;
    border: none;
    background: white;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.menu button:hover {
    background: #eef4ff;
    transform: translateY(-2px);
}


/* =====================================================
   REFRESH
===================================================== */

.refresh-box {
    margin-top: 25px;
    text-align: right;
}

.refresh-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #15803d;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

}


@media (max-width: 600px) {

    .header {
        padding: 15px;
    }

    .header h2 {
        font-size: 17px;
    }

    .logout {
        padding: 8px 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>
        Sales & Marketing System
    </h2>


    <button
        class="logout"
        id="logoutButton">

        Logout

    </button>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            Dashboard
        </h1>

        <p id="welcomeText">
            Welcome to your Sales & Marketing Management System.
        </p>

    </div>



    <!-- =================================================
         DASHBOARD CARDS
    ================================================== -->

    <div class="cards">


        <!-- TOTAL SALES -->

        <div class="card">

            <h3>
                Total Sales
            </h3>

            <div
                class="number"
                id="totalSales">

                ৳ 0

            </div>

        </div>



        <!-- CUSTOMERS -->

        <div class="card">

            <h3>
                Total Customers
            </h3>

            <div
                class="number"
                id="totalCustomers">

                0

            </div>

        </div>



        <!-- PRODUCTS -->

        <div class="card">

            <h3>
                Total Products
            </h3>

            <div
                class="number"
                id="totalProducts">

                0

            </div>

        </div>



        <!-- TODAY SALES -->

        <div class="card">

            <h3>
                Today's Sales
            </h3>

            <div
                class="number"
                id="todaySales">

                ৳ 0

            </div>

        </div>

    </div>



    <!-- =================================================
         REFRESH
    ================================================== -->

    <div class="refresh-box">

        <button
            class="refresh-btn"
            id="refreshButton">

            🔄 Refresh Dashboard

        </button>

    </div>



    <!-- =================================================
         MENU
    ================================================== -->

    <div class="menu">


        <button onclick="go('sales.html')">

            📊 Sales Entry

        </button>


        <button onclick="go('sales-history.html')">

            📋 Sales History

        </button>


        <button onclick="go('customers.html')">

            👥 Customers

        </button>


        <button onclick="go('products.html')">

            📦 Products

        </button>


        <button onclick="go('inventory.html')">

            📋 Inventory

        </button>


        <button onclick="go('reports.html')">

            📈 Reports

        </button>


        <button onclick="go('marketing.html')">

            📢 Marketing

        </button>


        <button onclick="go('settings.html')">

            ⚙️ Settings

        </button>

    </div>


</div>



<script>


// =====================================================
// SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// ELEMENTS
// =====================================================

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const welcomeText =
    document.getElementById("welcomeText");



// =====================================================
// CHECK LOGIN SESSION
// =====================================================

async function checkLogin() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            window.location.href =
                "index.html";

            return;

        }


        // No logged-in user

        if (!data.session) {

            window.location.href =
                "index.html";

            return;

        }


        // Show logged-in email

        if (
            data.session.user &&
            data.session.user.email
        ) {

            welcomeText.innerText =
                "Welcome, " +
                data.session.user.email +
                " — Sales & Marketing Management System.";

        }

    }

    catch (error) {

        console.error(
            "Authentication error:",
            error
        );

        window.location.href =
            "index.html";

    }

}


checkLogin();



// =====================================================
// LOGOUT
// =====================================================

async function logout() {

    logoutButton.disabled =
        true;

    logoutButton.innerText =
        "Logging out...";


    try {

        const {
            error
        } =
        await supabaseClient.auth.signOut();


        if (error) {

            console.error(
                "Logout error:",
                error
            );


            alert(
                "Logout failed: " +
                error.message
            );


            logoutButton.disabled =
                false;

            logoutButton.innerText =
                "Logout";

            return;

        }


        // Logout successful

        window.location.replace(
            "index.html"
        );

    }

    catch (error) {

        console.error(
            "Unexpected logout error:",
            error
        );


        alert(
            "Something went wrong during logout."
        );


        logoutButton.disabled =
            false;

        logoutButton.innerText =
            "Logout";

    }

}



// =====================================================
// LOGOUT BUTTON
// =====================================================

logoutButton.addEventListener(
    "click",
    logout
);



// =====================================================
// SAFE LOCAL STORAGE
// =====================================================

function getData(key) {

    try {

        const data =
            localStorage.getItem(key);


        if (!data) {

            return [];

        }


        const parsed =
            JSON.parse(data);


        return Array.isArray(parsed)
            ? parsed
            : [];

    }

    catch(error) {

        console.error(
            "Storage error:",
            key,
            error
        );


        return [];

    }

}



// =====================================================
// LOAD DASHBOARD
// =====================================================

function loadDashboard() {


    // CUSTOMERS

    const customers =
        getData("customers");


    // PRODUCTS

    const products =
        getData("products");


    // SALES

    const sales =
        getData("sales");



    // TOTAL CUSTOMERS

    document.getElementById(
        "totalCustomers"
    ).innerText =
        customers.length;



    // TOTAL PRODUCTS

    document.getElementById(
        "totalProducts"
    ).innerText =
        products.length;



    // TOTAL SALES

    let totalSales = 0;


    sales.forEach(
        function(sale) {

            totalSales +=
                Number(sale.total) || 0;

        }
    );


    document.getElementById(
        "totalSales"
    ).innerText =
        "৳ " +
        totalSales.toLocaleString();



    // TODAY SALES

    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    let todaySales = 0;


    sales.forEach(
        function(sale) {

            if (
                String(sale.date) ===
                today
            ) {

                todaySales +=
                    Number(sale.total) || 0;

            }

        }
    );


    document.getElementById(
        "todaySales"
    ).innerText =
        "৳ " +
        todaySales.toLocaleString();

}



// =====================================================
// PAGE NAVIGATION
// =====================================================

function go(page) {

    window.location.href =
        page;

}



// =====================================================
// REFRESH BUTTON
// =====================================================

refreshButton.addEventListener(
    "click",
    loadDashboard
);



// =====================================================
// INITIAL LOAD
// =====================================================

loadDashboard();

</script>


</body>

</html>
```
