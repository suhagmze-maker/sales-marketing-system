<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:22px;
}

.back-btn{
    background:white;
    color:#2563eb;
    border:none;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1500px;
    margin:30px auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
    color:#222;
    margin-bottom:20px;
}


/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.summary-card p{
    color:#666;
    margin-bottom:8px;
}

.summary-card h2{
    color:#2563eb;
}


/* FILTERS */

.filters{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr auto;
    gap:12px;
    margin-bottom:20px;
}

.filter-item{
    display:flex;
    flex-direction:column;
}

.filter-label{
    font-size:12px;
    color:#666;
    margin-bottom:5px;
    font-weight:bold;
}

.filters input,
.filters select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
    background:white;
}

.clear-btn{
    background:#64748b;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    align-self:end;
}

.clear-btn:hover{
    background:#475569;
}


/* RESULT */

.result-info{
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
}


/* TABLE */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1500px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#f1f5f9;
}

.employee{
    font-weight:bold;
    color:#16a34a;
}

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#b91c1c;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

.loading{
    text-align:center;
    padding:30px;
    color:#2563eb;
    font-weight:bold;
}


/* MOBILE */

@media(max-width:1000px){

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:700px){

    .summary{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .container{
        padding:10px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

```
<h2>
    Sales History
</h2>

<button
    class="back-btn"
    onclick="goDashboard()">

    Dashboard

</button>
```

</div>

<div class="container">

<!-- SUMMARY -->

<div class="summary">

```
<div class="summary-card">

    <p>
        Total Sales
    </p>

    <h2 id="totalSales">
        ৳ 0
    </h2>

</div>


<div class="summary-card">

    <p>
        Total Quantity
    </p>

    <h2 id="totalQuantity">
        0
    </h2>

</div>


<div class="summary-card">

    <p>
        Total Transactions
    </p>

    <h2 id="totalTransactions">
        0
    </h2>

</div>
```

</div>

<!-- SALES HISTORY -->

<div class="box">

<h1>
    Sales History
</h1>

<!-- FILTERS -->

<div class="filters">

```
<!-- SEARCH -->

<div class="filter-item">

    <label class="filter-label">
        Search
    </label>

    <input
        type="text"
        id="searchInput"
        placeholder="Customer / Phone / Product / Code">

</div>



<!-- CUSTOMER -->

<div class="filter-item">

    <label class="filter-label">
        Customer
    </label>

    <select id="customerFilter">

        <option value="">
            All Customers
        </option>

    </select>

</div>



<!-- FROM DATE -->

<div class="filter-item">

    <label class="filter-label">
        From Date
    </label>

    <input
        type="date"
        id="fromDate">

</div>



<!-- TO DATE -->

<div class="filter-item">

    <label class="filter-label">
        To Date
    </label>

    <input
        type="date"
        id="toDate">

</div>



<!-- CLEAR -->

<button
    class="clear-btn"
    onclick="clearFilters()">

    Clear

</button>
```

</div>

<div
    class="result-info"
    id="resultInfo">

```
Loading sales...
```

</div>

<!-- TABLE -->

<div class="table-container">

<table>

<thead>

<tr>

```
<th>Date</th>

<th>Customer</th>

<th>Phone</th>

<th>Product</th>

<th>Code</th>

<th>Category</th>

<th>Pack Size</th>

<th>Unit</th>

<th>Quantity</th>

<th>TP</th>

<th>MRP</th>

<th>Total</th>

<th>Action</th>
```

</tr>

</thead>

<tbody id="salesList">

<tr>

```
<td
    colspan="13"
    class="loading">

    Loading sales...

</td>
```

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   DATA
===================================================== */

let sales = [];



/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const customerFilter =
    document.getElementById(
        "customerFilter"
    );


const fromDate =
    document.getElementById(
        "fromDate"
    );


const toDate =
    document.getElementById(
        "toDate"
    );


const salesList =
    document.getElementById(
        "salesList"
    );



/* =====================================================
   LOAD SALES
===================================================== */

async function loadSales(){

    salesList.innerHTML = `

        <tr>

            <td
                colspan="13"
                class="loading">

                Loading sales...

            </td>

        </tr>

    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("sales")
            .select(`
                id,
                customer_id,
                customer_name,
                customer_phone,
                product_id,
                product_name,
                product_code,
                category,
                pack_size,
                unit,
                quantity,
                tp,
                mrp,
                total,
                sale_date,
                created_at
            `)
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Sales Load Error:",
                error
            );


            salesList.innerHTML = `

                <tr>

                    <td
                        colspan="13"
                        class="empty">

                        Failed to load sales:
                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;


            document.getElementById(
                "resultInfo"
            ).innerText =
                "Failed to load sales.";


            return;

        }


        sales =
            data || [];


        loadCustomerFilter();

        displaySales();


    }

    catch(error){

        console.error(
            "Unexpected Error:",
            error
        );


        salesList.innerHTML = `

            <tr>

                <td
                    colspan="13"
                    class="empty">

                    Something went wrong:
                    ${escapeHTML(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}



/* =====================================================
   CUSTOMER FILTER
===================================================== */

function loadCustomerFilter(){

    const currentValue =
        customerFilter.value;


    customerFilter.innerHTML = `

        <option value="">
            All Customers
        </option>

    `;


    const customers =
        [
            ...new Set(

                sales
                    .map(
                        function(sale){

                            return sale.customer_name;

                        }
                    )
                    .filter(
                        function(name){

                            return name;

                        }
                    )

            )
        ];


    customers.sort();


    customers.forEach(
        function(customer){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                customer;


            option.textContent =
                customer;


            customerFilter.appendChild(
                option
            );

        }
    );


    if(
        customers.includes(
            currentValue
        )
    ){

        customerFilter.value =
            currentValue;

    }

}



/* =====================================================
   SALE DATE
===================================================== */

function getSaleDate(sale){

    /*
       First priority:
       sale_date

       If not available:
       created_at
    */

    const value =
        sale.sale_date ||
        sale.created_at;


    if(!value){

        return "";

    }


    /*
       If sale_date is already YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            String(value)
        )
    ){

        return String(value);

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



/* =====================================================
   DISPLAY DATE
===================================================== */

function formatDate(value){

    if(!value){

        return "-";

    }


    /*
       Direct YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            String(value)
        )
    ){

        const parts =
            String(value).split("-");


        return (
            parts[2] +
            "/" +
            parts[1] +
            "/" +
            parts[0]
        );

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "-";

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}



/* =====================================================
   FILTER SALES
===================================================== */

function getFilteredSales(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const customer =
        customerFilter.value;


    const selectedFromDate =
        fromDate.value;


    const selectedToDate =
        toDate.value;



    if(
        selectedFromDate &&
        selectedToDate &&
        selectedFromDate > selectedToDate
    ){

        alert(
            "From Date cannot be after To Date."
        );


        return [];

    }



    return sales.filter(
        function(sale){

            /* =========================================
               SEARCH
            ========================================= */

            const customerName =
                String(
                    sale.customer_name || ""
                ).toLowerCase();


            const phone =
                String(
                    sale.customer_phone || ""
                ).toLowerCase();


            const product =
                String(
                    sale.product_name || ""
                ).toLowerCase();


            const code =
                String(
                    sale.product_code || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                customerName.includes(search) ||
                phone.includes(search) ||
                product.includes(search) ||
                code.includes(search);


            if(!matchesSearch){

                return false;

            }



            /* =========================================
               CUSTOMER
            ========================================= */

            if(
                customer &&
                sale.customer_name !== customer
            ){

                return false;

            }



            /* =========================================
               DATE
            ========================================= */

            const saleDate =
                getSaleDate(
                    sale
                );


            if(
                selectedFromDate &&
                saleDate < selectedFromDate
            ){

                return false;

            }


            if(
                selectedToDate &&
                saleDate > selectedToDate
            ){

                return false;

            }


            return true;

        }
    );

}



/* =====================================================
   DISPLAY SALES
===================================================== */

function displaySales(){

    const filteredSales =
        getFilteredSales();


    salesList.innerHTML = "";


    let totalSales = 0;

    let totalQuantity = 0;



    document.getElementById(
        "resultInfo"
    ).innerText =
        "Showing " +
        filteredSales.length +
        " of " +
        sales.length +
        " sales";



    /* ==============================================
       NO DATA
    ============================================== */

    if(
        filteredSales.length === 0
    ){

        salesList.innerHTML = `

            <tr>

                <td
                    colspan="13"
                    class="empty">

                    No sales found.

                </td>

            </tr>

        `;


        updateSummary(
            0,
            0,
            0
        );


        return;

    }



    /* ==============================================
       LOOP
    ============================================== */

    filteredSales.forEach(
        function(sale){

            totalSales +=
                Number(
                    sale.total || 0
                );


            totalQuantity +=
                Number(
                    sale.quantity || 0
                );



            const row =
                document.createElement(
                    "tr"
                );


            const pack =
                (
                    (sale.pack_size || "") +
                    " " +
                    (sale.unit || "")
                ).trim();


            row.innerHTML = `

                <td>
                    ${formatDate(
                        getSaleDate(
                            sale
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.customer_name || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.customer_phone || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.product_name || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.product_code || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.category || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.pack_size || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.unit || "-"
                    )}
                </td>


                <td>
                    ${Number(
                        sale.quantity || 0
                    ).toLocaleString()}
                </td>


                <td>
                    ৳ ${Number(
                        sale.tp || 0
                    ).toLocaleString()}
                </td>


                <td>
                    ৳ ${Number(
                        sale.mrp || 0
                    ).toLocaleString()}
                </td>


                <td>
                    ৳ ${Number(
                        sale.total || 0
                    ).toLocaleString()}
                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteSale('${sale.id}')">

                        Delete

                    </button>

                </td>

            `;


            salesList.appendChild(
                row
            );

        }
    );



    updateSummary(
        totalSales,
        totalQuantity,
        filteredSales.length
    );

}



/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
    totalSales,
    totalQuantity,
    totalTransactions
){

    document.getElementById(
        "totalSales"
    ).innerText =
        "৳ " +
        Number(
            totalSales || 0
        ).toLocaleString();


    document.getElementById(
        "totalQuantity"
    ).innerText =
        Number(
            totalQuantity || 0
        ).toLocaleString();


    document.getElementById(
        "totalTransactions"
    ).innerText =
        totalTransactions;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        displaySales();

    }
);



/* =====================================================
   CUSTOMER FILTER
===================================================== */

customerFilter.addEventListener(
    "change",
    function(){

        displaySales();

    }
);



/* =====================================================
   FROM DATE
===================================================== */

fromDate.addEventListener(
    "change",
    function(){

        displaySales();

    }
);



/* =====================================================
   TO DATE
===================================================== */

toDate.addEventListener(
    "change",
    function(){

        displaySales();

    }
);



/* =====================================================
   CLEAR
===================================================== */

function clearFilters(){

    searchInput.value =
        "";

    customerFilter.value =
        "";

    fromDate.value =
        "";

    toDate.value =
        "";

    displaySales();

}



/* =====================================================
   DELETE SALE
===================================================== */

async function deleteSale(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this sale?"
        );


    if(!confirmDelete){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("sales")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Delete failed: " +
                error.message
            );


            return;

        }


        alert(
            "Sale deleted successfully."
        );


        await loadSales();

    }

    catch(error){

        console.error(
            "Delete Unexpected Error:",
            error
        );


        alert(
            "Something went wrong: " +
            error.message
        );

    }

}



/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}



/* =====================================================
   INITIAL LOAD
===================================================== */

loadSales();



/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadSales,
    10000
);

</script>

</body>

</html>
