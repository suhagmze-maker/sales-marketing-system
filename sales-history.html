<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: white;
    color: #2563eb;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1400px;
    margin: 30px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

h1 {
    color: #222;
    margin-bottom: 20px;
}

/* ================================
   SUMMARY
================================ */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.summary-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.summary-card p {
    color: #666;
    margin-bottom: 8px;
}

.summary-card h2 {
    color: #2563eb;
}

/* ================================
   FILTER AREA
================================ */

.filters {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    margin-bottom: 25px;
}

.filters input,
.filters select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
}

.clear-btn {
    background: #64748b;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.clear-btn:hover {
    background: #475569;
}

/* ================================
   TABLE
================================ */

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1200px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f1f5f9;
}

.pack {
    font-weight: bold;
    color: #2563eb;
}

.employee {
    font-weight: bold;
    color: #16a34a;
}

.delete-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #b91c1c;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #2563eb;
    font-weight: bold;
}

.result-info {
    margin-bottom: 15px;
    color: #555;
    font-weight: bold;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 900px) {

    .filters {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 700px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }

}

</style>

</head>


<body>


<!-- ======================================
     HEADER
====================================== -->

<div class="header">

    <h2>
        Sales History
    </h2>

    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</div>



<div class="container">


<!-- ======================================
     SUMMARY
====================================== -->

<div class="summary">


    <div class="summary-card">

        <p>
            Total Sales
        </p>

        <h2 id="totalSales">
            ৳ 0
        </h2>

    </div>


    <div class="summary-card">

        <p>
            Total Quantity
        </p>

        <h2 id="totalQuantity">
            0
        </h2>

    </div>


    <div class="summary-card">

        <p>
            Total Transactions
        </p>

        <h2 id="totalTransactions">
            0
        </h2>

    </div>


</div>



<!-- ======================================
     SALES HISTORY
====================================== -->

<div class="box">

<h1>
    Sales History
</h1>


<!-- ======================================
     FILTERS
====================================== -->

<div class="filters">


    <!-- SEARCH -->

    <input
        type="text"
        id="searchInput"
        placeholder="Search customer or product...">


    <!-- EMPLOYEE -->

    <select id="employeeFilter">

        <option value="">
            All Employees
        </option>

    </select>


    <!-- DATE -->

    <input
        type="date"
        id="dateFilter">


    <!-- CLEAR -->

    <button
        class="clear-btn"
        onclick="clearFilters()">

        Clear

    </button>


</div>



<div
    class="result-info"
    id="resultInfo">

    Showing all sales

</div>



<!-- ======================================
     TABLE
====================================== -->

<div class="table-container">

<table>

<thead>

<tr>

    <th>
        Date
    </th>

    <th>
        Customer
    </th>

    <th>
        Employee
    </th>

    <th>
        Product
    </th>

    <th>
        Quantity
    </th>

    <th>
        TP
    </th>

    <th>
        Total
    </th>

    <th>
        Action
    </th>

</tr>

</thead>


<tbody id="salesList">

<tr>

    <td
        colspan="8"
        class="loading">

        Loading sales...

    </td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ucrtujcqrpjcwepiugak.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_RnDm7gJ6ROuU49hcY_BA3g_snx27-M9";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   SALES DATA
===================================================== */

let sales = [];



/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const employeeFilter =
    document.getElementById(
        "employeeFilter"
    );


const dateFilter =
    document.getElementById(
        "dateFilter"
    );


const salesList =
    document.getElementById(
        "salesList"
    );



/* =====================================================
   LOAD SALES
===================================================== */

async function loadSales() {


    salesList.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="loading">

                Loading sales...

            </td>

        </tr>

    `;


    try {


        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {


            console.error(
                "Supabase Error:",
                error
            );


            salesList.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="empty">

                        Failed to load sales:
                        ${error.message}

                    </td>

                </tr>

            `;


            return;

        }


        sales =
            data || [];


        loadEmployeeFilter();


        displaySales();


    }

    catch(error) {


        console.error(
            "Unexpected Error:",
            error
        );


        salesList.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    Something went wrong:
                    ${error.message}

                </td>

            </tr>

        `;

    }

}



/* =====================================================
   EMPLOYEE FILTER
===================================================== */

function loadEmployeeFilter() {


    const currentValue =
        employeeFilter.value;


    employeeFilter.innerHTML = `

        <option value="">
            All Employees
        </option>

    `;


    const employees =
        [
            ...new Set(
                sales
                    .map(
                        function(sale) {

                            return sale.employee_name;

                        }
                    )
                    .filter(
                        function(name) {

                            return name;

                        }
                    )
            )
        ];


    employees.sort();


    employees.forEach(
        function(employee) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                employee;


            option.textContent =
                employee;


            employeeFilter.appendChild(
                option
            );

        }
    );


    if (
        employees.includes(
            currentValue
        )
    ) {

        employeeFilter.value =
            currentValue;

    }

}



/* =====================================================
   FILTER SALES
===================================================== */

function getFilteredSales() {


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const employee =
        employeeFilter.value;


    const selectedDate =
        dateFilter.value;


    return sales.filter(
        function(sale) {


            /* =============================
               SEARCH
            ============================= */

            const customer =
                String(
                    sale.customer_name || ""
                ).toLowerCase();


            const product =
                String(
                    sale.product_name || ""
                ).toLowerCase();


            const employeeName =
                String(
                    sale.employee_name || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                customer.includes(search) ||
                product.includes(search) ||
                employeeName.includes(search);


            if (
                !matchesSearch
            ) {

                return false;

            }



            /* =============================
               EMPLOYEE
            ============================= */

            if (
                employee &&
                sale.employee_name !== employee
            ) {

                return false;

            }



            /* =============================
               DATE
            ============================= */

            if (
                selectedDate
            ) {


                if (
                    !sale.created_at
                ) {

                    return false;

                }


                const saleDate =
                    new Date(
                        sale.created_at
                    )
                    .toISOString()
                    .split("T")[0];


                if (
                    saleDate !== selectedDate
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}



/* =====================================================
   DISPLAY SALES
===================================================== */

function displaySales() {


    const filteredSales =
        getFilteredSales();


    salesList.innerHTML = "";


    let totalSales = 0;

    let totalQuantity = 0;



    /* ==============================================
       RESULT INFO
    ============================================== */

    document.getElementById(
        "resultInfo"
    ).innerText =
        "Showing " +
        filteredSales.length +
        " of " +
        sales.length +
        " sales";



    /* ==============================================
       NO SALES
    ============================================== */

    if (
        filteredSales.length === 0
    ) {


        salesList.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    No sales found.

                </td>

            </tr>

        `;


        updateSummary(
            0,
            0,
            0
        );


        return;

    }



    /* ==============================================
       SALES LOOP
    ============================================== */

    filteredSales.forEach(
        function(sale) {


            totalSales +=
                Number(
                    sale.total_amount || 0
                );


            totalQuantity +=
                Number(
                    sale.quantity || 0
                );



            /* ======================================
               DATE
            ====================================== */

            let saleDate =
                "-";


            if (
                sale.created_at
            ) {


                saleDate =
                    new Date(
                        sale.created_at
                    ).toLocaleDateString(
                        "en-GB"
                    );

            }



            /* ======================================
               ROW
            ====================================== */

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${saleDate}
                </td>


                <td>
                    ${escapeHTML(
                        sale.customer_name || "-"
                    )}
                </td>


                <td class="employee">
                    ${escapeHTML(
                        sale.employee_name || "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        sale.product_name || "-"
                    )}
                </td>


                <td>
                    ${sale.quantity || 0}
                </td>


                <td>
                    ৳ ${Number(
                        sale.unit_price || 0
                    ).toLocaleString()}
                </td>


                <td>
                    ৳ ${Number(
                        sale.total_amount || 0
                    ).toLocaleString()}
                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteSale('${sale.id}')">

                        Delete

                    </button>

                </td>

            `;


            salesList.appendChild(
                row
            );

        }
    );



    /* ==============================================
       SUMMARY
    ============================================== */

    updateSummary(
        totalSales,
        totalQuantity,
        filteredSales.length
    );

}



/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
    totalSales,
    totalQuantity,
    totalTransactions
) {


    document.getElementById(
        "totalSales"
    ).innerText =
        "৳ " +
        totalSales.toLocaleString();


    document.getElementById(
        "totalQuantity"
    ).innerText =
        totalQuantity.toLocaleString();


    document.getElementById(
        "totalTransactions"
    ).innerText =
        totalTransactions;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   SEARCH EVENT
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        displaySales();

    }
);



/* =====================================================
   EMPLOYEE EVENT
===================================================== */

employeeFilter.addEventListener(
    "change",
    function() {

        displaySales();

    }
);



/* =====================================================
   DATE EVENT
===================================================== */

dateFilter.addEventListener(
    "change",
    function() {

        displaySales();

    }
);



/* =====================================================
   CLEAR FILTERS
===================================================== */

function clearFilters() {


    searchInput.value =
        "";


    employeeFilter.value =
        "";


    dateFilter.value =
        "";


    displaySales();

}



/* =====================================================
   DELETE SALE
===================================================== */

async function deleteSale(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this sale?"
        );


    if (
        !confirmDelete
    ) {

        return;

    }


    try {


        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .delete()
            .eq(
                "id",
                id
            );


        if (error) {


            console.error(
                "Delete Error:",
                error
            );


            alert(
                "Delete failed: " +
                error.message
            );


            return;

        }


        alert(
            "Sale deleted successfully."
        );


        await loadSales();

    }

    catch(error) {


        console.error(
            error
        );


        alert(
            "Something went wrong: " +
            error.message
        );

    }

}



/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard() {


    window.location.href =
        "dashboard.html";

}



/* =====================================================
   INITIAL LOAD
===================================================== */

loadSales();



/* =====================================================
   AUTO REFRESH
   EVERY 10 SECONDS
===================================================== */

setInterval(
    loadSales,
    10000
);

</script>


</body>

</html>
